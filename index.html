<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reparto de Nómina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS — tema claro en :root, oscuro redefinido dos veces
   ============================================================ */
:root{
  color-scheme: light;

  --bg:        #F2F2F7;
  --bg-tint:   #EAEAF2;
  --surface:   #FFFFFF;
  --surface-2: #F5F5FA;
  --surface-3: #ECECF4;
  --line:      #E1E1EC;
  --line-soft: #EDEDF4;

  --ink:   #14161D;
  --ink-2: #565C6E;
  --ink-3: #878DA0;

  --accent:      #6742F0;
  --accent-ink:  #FFFFFF;
  --accent-soft: rgba(103,66,240,.10);
  --accent-line: rgba(103,66,240,.28);

  --pos: #17A673;
  --warn:#C77A08;
  --neg: #D33A40;
  --pos-soft: rgba(23,166,115,.12);
  --warn-soft:rgba(199,122,8,.12);
  --neg-soft: rgba(211,58,64,.11);

  /* partidas */
  --c-casa:      #D33A40;
  --c-conjunta:  #E08A0B;
  --c-fijos:     #2F72E8;
  --c-ocioLibre: #6742F0;
  --c-coche:     #0F9CB4;
  --c-caprichos: #DB4A85;
  --c-ahorro:    #17A673;

  --shadow-1: 0 1px 2px rgba(16,18,28,.05), 0 1px 1px rgba(16,18,28,.04);
  --shadow-2: 0 8px 26px -10px rgba(16,18,28,.22), 0 2px 6px rgba(16,18,28,.05);
  --shadow-3: 0 26px 60px -18px rgba(16,18,28,.34);

  --r-s: 10px; --r-m: 14px; --r-l: 20px; --r-xl: 26px;

  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --rail-w: 244px;
  --wrap: 1180px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #0B0D12;
    --bg-tint:   #10131A;
    --surface:   #14171F;
    --surface-2: #1A1E28;
    --surface-3: #222736;
    --line:      #272C39;
    --line-soft: #1E222D;

    --ink:   #ECEEF5;
    --ink-2: #99A0B2;
    --ink-3: #676E80;

    --accent:      #8B6DFF;
    --accent-ink:  #0B0D12;
    --accent-soft: rgba(139,109,255,.15);
    --accent-line: rgba(139,109,255,.36);

    --pos: #3AD69B;
    --warn:#F5B33C;
    --neg: #FF6169;
    --pos-soft: rgba(58,214,155,.13);
    --warn-soft:rgba(245,179,60,.13);
    --neg-soft: rgba(255,97,105,.13);

    --c-casa:      #FF6169;
    --c-conjunta:  #F5B33C;
    --c-fijos:     #5D9BFF;
    --c-ocioLibre: #8B6DFF;
    --c-coche:     #35CFE4;
    --c-caprichos: #FF7DB0;
    --c-ahorro:    #3AD69B;

    --shadow-1: 0 1px 2px rgba(0,0,0,.5);
    --shadow-2: 0 10px 30px -12px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.35);
    --shadow-3: 0 30px 70px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #0B0D12;
  --bg-tint:   #10131A;
  --surface:   #14171F;
  --surface-2: #1A1E28;
  --surface-3: #222736;
  --line:      #272C39;
  --line-soft: #1E222D;

  --ink:   #ECEEF5;
  --ink-2: #99A0B2;
  --ink-3: #676E80;

  --accent:      #8B6DFF;
  --accent-ink:  #0B0D12;
  --accent-soft: rgba(139,109,255,.15);
  --accent-line: rgba(139,109,255,.36);

  --pos: #3AD69B;
  --warn:#F5B33C;
  --neg: #FF6169;
  --pos-soft: rgba(58,214,155,.13);
  --warn-soft:rgba(245,179,60,.13);
  --neg-soft: rgba(255,97,105,.13);

  --c-casa:      #FF6169;
  --c-conjunta:  #F5B33C;
  --c-fijos:     #5D9BFF;
  --c-ocioLibre: #8B6DFF;
  --c-coche:     #35CFE4;
  --c-caprichos: #FF7DB0;
  --c-ahorro:    #3AD69B;

  --shadow-1: 0 1px 2px rgba(0,0,0,.5);
  --shadow-2: 0 10px 30px -12px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.35);
  --shadow-3: 0 30px 70px -20px rgba(0,0,0,.85);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
img{ max-width:100%; }
[hidden]{ display:none !important; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }
a{ color: var(--accent); }
h1,h2,h3,h4{ margin:0; font-family:var(--font-display); font-weight:700; text-wrap:balance; letter-spacing:-.014em; }
p{ margin:0; }
ul,ol{ margin:0; padding:0; list-style:none; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
::selection{ background: var(--accent-soft); }

.mono{ font-family:var(--font-mono); font-variant-numeric: tabular-nums; }
.num{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ============================================================
   ESQUELETO
   ============================================================ */
.app{ min-height:100dvh; display:flex; }

.rail{
  width: var(--rail-w); flex:0 0 var(--rail-w);
  border-right:1px solid var(--line);
  background: var(--bg-tint);
  position:sticky; top:0; height:100dvh;
  display:flex; flex-direction:column; gap:6px;
  padding:18px 12px 14px;
}
.brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 16px; }
.brand__mark{
  width:32px; height:32px; border-radius:9px; flex:none;
  background: linear-gradient(150deg, var(--accent), var(--c-coche));
  display:grid; place-items:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
}
.brand__name{ font-family:var(--font-display); font-weight:700; font-size:15.5px; letter-spacing:-.02em; line-height:1.15; }
.brand__sub{ font-size:11px; color:var(--ink-3); letter-spacing:.03em; }

.nav{ display:flex; flex-direction:column; gap:2px; }
.nav__item{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:9px 11px; border-radius:var(--r-s);
  color:var(--ink-2); font-size:14.5px; font-weight:500; text-align:left;
  transition: background .14s ease, color .14s ease;
}
.nav__item:hover{ background:var(--surface-3); color:var(--ink); }
.nav__item[aria-current="page"]{ background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow-1); }
.nav__item[aria-current="page"] .ic{ color:var(--accent); }
.nav__badge{ margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--accent-ink); }
.ic{ width:18px; height:18px; flex:none; color:var(--ink-3); }
.nav__item:hover .ic{ color:var(--ink-2); }

.rail__foot{ margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:10px 4px 0; border-top:1px solid var(--line); }
.storage{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-3); padding:0 7px; }
.storage__dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:none; }
.storage[data-state="sync"] .storage__dot{ background:var(--pos); box-shadow:0 0 0 3px var(--pos-soft); }
.storage[data-state="local"] .storage__dot{ background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft); }
.storage[data-state="saving"] .storage__dot{ background:var(--accent); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse{ 50%{ opacity:.25 } }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.wrap{ width:100%; max-width:var(--wrap); margin:0 auto; padding:26px 28px 120px; }

.topbar{
  position:sticky; top:0; z-index:30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.topbar__in{ max-width:var(--wrap); margin:0 auto; padding:12px 28px; display:flex; align-items:center; gap:14px; }
.topbar__title{ font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:-.02em; }
.topbar__spacer{ flex:1; }

/* selector de mes */
.monthpick{ display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow-1); }
.monthpick button{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); }
.monthpick button:hover:not(:disabled){ background:var(--surface-3); color:var(--ink); }
.monthpick button:disabled{ opacity:.3; cursor:default; }
.monthpick__label{ min-width:112px; text-align:center; font-size:13.5px; font-weight:600; text-transform:capitalize; }

/* ============================================================
   BOTONES
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 15px; border-radius:var(--r-s); font-size:14px; font-weight:600;
  border:1px solid transparent; min-height:38px;
  transition: background .14s ease, border-color .14s ease, transform .1s ease, opacity .14s;
}
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.42; cursor:not-allowed; transform:none; }
.btn--primary{ background:var(--accent); color:var(--accent-ink); }
.btn--primary:hover:not(:disabled){ background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn--ghost{ background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow-1); }
.btn--ghost:hover:not(:disabled){ background:var(--surface-2); border-color:var(--ink-3); }
.btn--quiet{ background:transparent; color:var(--ink-2); }
.btn--quiet:hover:not(:disabled){ background:var(--surface-3); color:var(--ink); }
.btn--danger{ background:var(--neg-soft); color:var(--neg); border-color:transparent; }
.btn--danger:hover:not(:disabled){ background:var(--neg); color:#fff; }
.btn--wide{ width:100%; }
.btn--lg{ min-height:48px; font-size:15.5px; padding:12px 20px; border-radius:var(--r-m); }
.btn--sm{ min-height:30px; padding:5px 11px; font-size:13px; border-radius:8px; }
.btn .ic{ color:currentColor; }

.iconbtn{ width:36px; height:36px; border-radius:var(--r-s); display:grid; place-items:center; color:var(--ink-2); border:1px solid transparent; }
.iconbtn:hover{ background:var(--surface-3); color:var(--ink); }
.iconbtn--bordered{ background:var(--surface); border-color:var(--line); box-shadow:var(--shadow-1); }

/* ============================================================
   TARJETAS Y REJILLA
   ============================================================ */
.grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
.col-3{ grid-column:span 3 } .col-4{ grid-column:span 4 } .col-5{ grid-column:span 5 }
.col-6{ grid-column:span 6 } .col-7{ grid-column:span 7 } .col-8{ grid-column:span 8 }
.col-9{ grid-column:span 9 } .col-12{ grid-column:span 12 }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:18px; box-shadow:var(--shadow-1); min-width:0;
  display:flex; flex-direction:column; gap:14px;
}
.card--pad0{ padding:0; overflow:hidden; }
.card--flat{ box-shadow:none; background:var(--surface-2); }
.card__head{ display:flex; align-items:flex-start; gap:12px; }
.card__title{ font-family:var(--font-display); font-size:15.5px; font-weight:700; letter-spacing:-.01em; }
.card__sub{ font-size:12.5px; color:var(--ink-3); margin-top:1px; }
.card__act{ margin-left:auto; display:flex; gap:6px; align-items:center; }

.label{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }

/* héroe de saldo */
.hero{
  grid-column:span 12;
  background:
    radial-gradient(120% 150% at 100% 0%, var(--accent-soft) 0%, transparent 58%),
    linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
  border:1px solid var(--line); border-radius:var(--r-l);
  padding:22px 24px; box-shadow:var(--shadow-2);
  display:flex; flex-wrap:wrap; gap:24px; align-items:flex-end;
}
.hero__main{ flex:1 1 260px; min-width:0; }
.hero__amount{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(2.15rem, 5.2vw, 3.05rem); line-height:1.02; letter-spacing:-.035em;
  font-variant-numeric: tabular-nums; margin-top:6px;
}
.hero__meta{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:13px; color:var(--ink-2); }
.hero__side{ display:flex; gap:26px; flex-wrap:wrap; }

.stat{ min-width:96px; }
.stat__v{ font-family:var(--font-display); font-weight:700; font-size:1.42rem; letter-spacing:-.025em; font-variant-numeric:tabular-nums; line-height:1.15; margin-top:3px; }
.stat__v--sm{ font-size:1.15rem; }
.stat__d{ font-size:12px; color:var(--ink-3); margin-top:2px; }

/* barra segmentada de reparto */
.segbar{ display:flex; gap:2px; height:11px; border-radius:999px; overflow:hidden; background:var(--surface-3); }
.segbar__s{ min-width:3px; transition: flex-grow .4s cubic-bezier(.2,.7,.3,1); }
.segbar--tall{ height:16px; }

/* progreso */
.prog{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.prog__f{ height:100%; border-radius:999px; background:var(--accent); transition:width .4s cubic-bezier(.2,.7,.3,1); }

/* chips y píldoras */
.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; background:var(--surface-3); color:var(--ink-2); white-space:nowrap; }
.pill--pos{ background:var(--pos-soft); color:var(--pos); }
.pill--warn{ background:var(--warn-soft); color:var(--warn); }
.pill--neg{ background:var(--neg-soft); color:var(--neg); }
.pill--accent{ background:var(--accent-soft); color:var(--accent); }
.dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }

/* ============================================================
   LISTAS / FILAS
   ============================================================ */
.rows{ display:flex; flex-direction:column; }
.row{
  display:flex; align-items:center; gap:12px; padding:11px 4px;
  border-bottom:1px solid var(--line-soft); min-width:0;
}
.row:last-child{ border-bottom:0; }
.row--btn{ width:100%; text-align:left; border-radius:8px; padding:11px 8px; }
.row--btn:hover{ background:var(--surface-2); }
.row__ic{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none; font-size:16px; background:var(--surface-3); }
.row__body{ flex:1; min-width:0; }
.row__t{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row__s{ font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row__v{ font-family:var(--font-mono); font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.row__v--neg{ color:var(--neg); }
.row__v--pos{ color:var(--pos); }

/* leyenda de donut */
.legend{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.legend__i{ display:flex; align-items:center; gap:9px; padding:5px 0; font-size:13px; min-width:0; }
.legend__n{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink-2); }
.legend__v{ font-family:var(--font-mono); font-size:12.5px; font-variant-numeric:tabular-nums; }
.legend__p{ font-size:11.5px; color:var(--ink-3); width:44px; text-align:right; font-variant-numeric:tabular-nums; }

/* ============================================================
   GRÁFICOS
   ============================================================ */
.chartwrap{ position:relative; width:100%; overflow-x:auto; }
.donutbox{ position:relative; width:186px; height:186px; flex:none; margin-inline:auto; }
.donutbox svg{ width:100%; height:100%; transform:rotate(-90deg); }
.donutbox__c{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:1px; }
.donutbox__v{ font-family:var(--font-display); font-weight:700; font-size:1.28rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.donut__seg{ transition: stroke-width .15s ease, opacity .15s ease; cursor:default; }
.donut__seg:hover{ stroke-width:20; }

.linechart{ width:100%; height:auto; display:block; }
.linechart text{ font-family:var(--font-ui); font-size:10.5px; fill:var(--ink-3); }
.lc-grid{ stroke:var(--line); stroke-width:1; }
.lc-area{ opacity:.13; }
.lc-line{ fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.lc-pt{ stroke:var(--surface); stroke-width:2; }

/* ============================================================
   FORMULARIOS
   ============================================================ */
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field__l{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
.field__h{ font-size:11.5px; color:var(--ink-3); }
.input, .select{
  width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s);
  padding:10px 12px; font-size:15px; min-height:42px; transition:border-color .14s, background .14s;
}
.input:hover,.select:hover{ border-color:var(--ink-3); }
.input:focus,.select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--surface); }
.input--money{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; text-align:right; font-weight:500; }
.input--big{ font-family:var(--font-display); font-size:2rem; font-weight:700; text-align:right; min-height:60px; letter-spacing:-.03em; }
.select{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:calc(100% - 17px) 19px, calc(100% - 12px) 19px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px; }
.inputgrp{ position:relative; }
.inputgrp__suf{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--ink-3); pointer-events:none; }
.inputgrp .input{ padding-right:32px; }

.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-s); padding:3px; gap:2px; }
.seg__b{ padding:6px 13px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-2); white-space:nowrap; }
.seg__b[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1); }
.seg--wide{ display:flex; }
.seg--wide .seg__b{ flex:1; text-align:center; }

.switch{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
.switch input{ position:absolute; opacity:0; width:0; height:0; }
.switch__t{ width:38px; height:22px; border-radius:999px; background:var(--surface-3); border:1px solid var(--line); position:relative; transition:background .16s; flex:none; }
.switch__t::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink-3); transition:transform .16s, background .16s; }
.switch input:checked + .switch__t{ background:var(--accent); border-color:var(--accent); }
.switch input:checked + .switch__t::after{ transform:translateX(16px); background:#fff; }
.switch input:focus-visible + .switch__t{ outline:2px solid var(--accent); outline-offset:2px; }

/* ============================================================
   FAB + BARRA INFERIOR
   ============================================================ */
.fabs{ position:fixed; right:22px; bottom:22px; z-index:40; display:flex; flex-direction:column; gap:12px; align-items:flex-end; }
.fab{
  height:56px; min-width:56px; padding:0 20px; border-radius:999px;
  display:inline-flex; align-items:center; gap:9px; justify-content:center;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px;
  box-shadow: 0 12px 30px -8px color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow-2);
  transition: transform .14s cubic-bezier(.2,.7,.3,1), box-shadow .14s;
}
.fab:hover{ transform:translateY(-2px); }
.fab:active{ transform:translateY(0); }
.fab--criba{ height:46px; font-size:14px; background:var(--surface); color:var(--ink); border:1px solid var(--accent-line); box-shadow:var(--shadow-2); }

.tabbar{ display:none; }

/* ============================================================
   MODALES / HOJAS
   ============================================================ */
.scrim{ position:fixed; inset:0; z-index:60; background:rgba(6,8,14,.58); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:grid; place-items:center; padding:20px; animation:fade .16s ease; }
@keyframes fade{ from{ opacity:0 } }
.sheet{
  width:100%; max-width:460px; max-height:min(88dvh, 780px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow-3); padding:20px; display:flex; flex-direction:column; gap:16px;
  animation:rise .2s cubic-bezier(.2,.8,.3,1);
}
.sheet--wide{ max-width:640px; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) scale(.985) } }
.sheet__head{ display:flex; align-items:flex-start; gap:12px; }
.sheet__t{ font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:-.02em; }
.sheet__s{ font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.sheet__foot{ display:flex; gap:10px; padding-top:2px; }
.sheet__foot .btn{ flex:1; }

/* teclado numérico */
.pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pad__k{
  height:52px; border-radius:var(--r-s); background:var(--surface-2); border:1px solid var(--line);
  font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--ink);
  display:grid; place-items:center; transition:background .1s;
}
.pad__k:hover{ background:var(--surface-3); }
.pad__k:active{ background:var(--accent-soft); }
.padout{
  text-align:right; font-family:var(--font-display); font-weight:700; letter-spacing:-.03em;
  font-size:2.6rem; line-height:1.1; padding:6px 4px; font-variant-numeric:tabular-nums;
  border-bottom:2px solid var(--line);
}
.padout[data-zero="true"]{ color:var(--ink-3); }

.quickcats{ display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
.qcat{
  display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 6px;
  border-radius:var(--r-s); border:1px solid var(--line); background:var(--surface-2);
  font-size:11.5px; font-weight:600; color:var(--ink-2); text-align:center; line-height:1.2;
  transition:border-color .14s, background .14s, color .14s;
}
.qcat:hover{ border-color:var(--ink-3); color:var(--ink); }
.qcat[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
.qcat__e{ font-size:19px; line-height:1; }

/* toast con deshacer */
.toasts{ position:fixed; left:50%; transform:translateX(-50%); bottom:26px; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 32px); max-width:420px; }
.toast{
  pointer-events:auto; display:flex; align-items:center; gap:12px; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:11px 12px 11px 15px; box-shadow:var(--shadow-3); font-size:13.5px;
  animation:rise .2s cubic-bezier(.2,.8,.3,1);
}
.toast__t{ flex:1; min-width:0; }

.toast__b:hover{ background:var(--accent-soft); }
.toast--pos{ border-color:color-mix(in srgb, var(--pos) 40%, var(--line)); }
.toast--neg{ border-color:color-mix(in srgb, var(--neg) 40%, var(--line)); }

/* estado vacío */
.empty{ text-align:center; padding:34px 18px; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:10px; }
.empty__e{ font-size:30px; }
.empty__t{ font-size:15px; font-weight:600; color:var(--ink-2); }
.empty__d{ font-size:13px; max-width:36ch; line-height:1.5; }

.note{ font-size:12.5px; color:var(--ink-3); line-height:1.5; }
.hr{ height:1px; background:var(--line-soft); border:0; margin:0; }

.kv{ display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line-soft); font-size:13.5px; }
.kv:last-child{ border-bottom:0; }

.kv--total{ font-weight:700; border-top:1px solid var(--line); border-bottom:0; margin-top:3px; padding-top:10px; }
.kv--total .kv__k{ color:var(--ink); font-weight:700; }

.hucha{ display:flex; flex-direction:column; gap:12px; padding:16px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); box-shadow:var(--shadow-1); position:relative; overflow:hidden; }

.hucha__top{ display:flex; align-items:flex-start; gap:11px; }

.hucha__grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }

/* tabla historial */
.tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }

.tblwrap{ overflow-x:auto; margin:0 -18px; padding:0 18px; }

<script>
"use strict";
/* ============================================================================
   REPARTO DE NÓMINA — núcleo
   Todo el dinero se maneja internamente en CÉNTIMOS ENTEROS.
   Nunca se guarda ni se suma un float de euros.
   ========================================================================== */

/* ---------- utilidades de importe ------------------------------------- */

const nf2  = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0  = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0 });
const nfPc = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nfPc2 = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfPc4 = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 4 });

/** Céntimos → "1.234,56 €" */
function eur(c, opt) {
  const o = opt || {};
  const n = Math.round(c || 0);
  const abs = Math.abs(n) / 100;
  const body = o.entero ? nf0.format(Math.round(abs)) : nf2.format(abs);
  const sgn = n < 0 ? '−' : (o.signo && n > 0 ? '+' : '');
  return sgn + body + (o.sinSimbolo ? '' : ' €');
}
/** Céntimos → "1.234,56" sin símbolo (para inputs) */
function eurRaw(c) { return nf2.format((c || 0) / 100); }

function pct(x) { return nfPc.format(x) + ' %'; }

/**
 * Texto libre → céntimos enteros. Acepta "1.234,56", "1234,5", "12.50", "60", "60 €".
 * Convención española: la coma es decimal, el punto es de millares, salvo que el punto
 * separe un grupo final que no tenga 3 cifras (teclado numérico: "12.50" = 12,50 €).
 * Devuelve null si no hay número.
 */
function parseMoney(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? redondeaCent(v * 100) : null;
  let s = String(v == null ? '' : v).trim()
    .replace(/[\u20ac\s\u00a0\u202f]/g, '')
    .replace(/[\u2212\u2013\u2014]/g, '-');
  if (!s) return null;
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  if (!/^[\d.,]+$/.test(s)) return null;

  const lastC = s.lastIndexOf(','), lastD = s.lastIndexOf('.');
  if (lastC >= 0 && lastD >= 0) {
    s = lastC > lastD ? s.replace(/\./g, '').replace(',', '.')
                      : s.replace(/,/g, '');
  } else if (lastC >= 0) {
    s = s.split(',').length === 2 ? s.replace(',', '.') : s.replace(/,/g, '');
  } else if (lastD >= 0) {
    const parts = s.split('.');
    const tail = parts[parts.length - 1];
    if (parts.length > 2 || tail.length === 3) s = s.replace(/\./g, '');
  }
  const m = /^(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (!m[1] && !m[2])) return null;
  const ent = m[1] || '0';
  const dec3 = ((m[2] || '') + '000').slice(0, 3);
  let cents = parseInt(ent, 10) * 100 + parseInt(dec3.slice(0, 2), 10);
  if (parseInt(dec3.charAt(2), 10) >= 5) cents += 1;      // tercer decimal: se redondea, no se trunca
  if (!Number.isFinite(cents)) return null;
  return neg ? -cents : cents;
}

/** Redondeo a céntimo simétrico. Math.round(-0.5) da -0 en JS; esto no. */
function redondeaCent(x) { return x < 0 ? -Math.round(-x) : Math.round(x); }

/** Porcentaje (42,5) → puntos básicos enteros (4250). Los pesos nunca son float. */
function bps(p) { return Math.round((Number(p) || 0) * 100); }

/**
 * Reparte `total` céntimos entre porcentajes, en aritmética ENTERA, por mayores restos.
 * La suma de las partes es EXACTAMENTE `total`, también con total negativo.
 * Los pesos no tienen que sumar 100: se normaliza por su suma.
 * Desempate total y determinista (mayor resto → mayor peso → orden de declaración)
 * para que el mismo mes dé siempre el mismo céntimo.
 * @returns {number[]} céntimos por peso, en el mismo orden
 */
function repartir(total, pesosPct) {
  const n = pesosPct.length;
  if (!n) return [];
  const pesos = pesosPct.map(bps);
  const Sp = pesos.reduce((a, b) => a + b, 0);
  const T = redondeaCent(total);
  if (!(Sp > 0)) { const r = new Array(n).fill(0); r[0] = T; return r; }

  const neg = T < 0, A = Math.abs(T);
  const items = pesos.map((w, i) => {
    const num = A * w;                 // ≤ 1e8 × 1e4 = 1e12, entero exacto
    const q = Math.floor(num / Sp);
    return { i, w, q, r: num - q * Sp };
  });
  const sobra = A - items.reduce((a, x) => a + x.q, 0);
  const orden = items.slice().sort((a, b) => (b.r - a.r) || (b.w - a.w) || (a.i - b.i));
  for (let k = 0; k < sobra; k++) orden[k].q += 1;

  const out = new Array(n);
  items.forEach(x => { out[x.i] = neg ? -x.q : x.q; });
  return out;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum   = arr => arr.reduce((a, b) => a + b, 0);

/* ---------- fechas ------------------------------------------------------ */

const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function mesActualKey() { return hoyISO().slice(0, 7); }
function mesLabel(key, corto) {
  const [y, m] = key.split('-').map(Number);
  const nom = (corto ? MESES_CORTO : MESES_LARGO)[clamp(m - 1, 0, 11)];
  return `${nom} ${y}`;
}
function mesSuma(key, n) {
  const [y, m] = key.split('-').map(Number);
  const t = (y * 12 + (m - 1)) + n;
  return `${Math.floor(t / 12)}-${String((t % 12) + 1).padStart(2, '0')}`;
}
function mesDiff(a, b) { // meses de a hasta b (b - a)
  const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
  return (yb * 12 + mb) - (ya * 12 + ma);
}
function fechaCorta(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const hoy = hoyISO();
  if (iso === hoy) return 'Hoy';
  const ay = new Date(); ay.setDate(ay.getDate() - 1);
  const ayer = `${ay.getFullYear()}-${String(ay.getMonth() + 1).padStart(2, '0')}-${String(ay.getDate()).padStart(2, '0')}`;
  if (iso === ayer) return 'Ayer';
  return `${d} ${MESES_CORTO[clamp(m - 1, 0, 11)]}${y !== new Date().getFullYear() ? ' ' + y : ''}`;
}

/* ============================================================================
   ALMACENAMIENTO
   Dos backends con la misma interfaz: el almacén sincronizado del artefacto
   (visible desde el móvil y el ordenador) y localStorage como respaldo.
   Documentos:  app/config · app/huchas · meses/YYYY-MM
   ========================================================================== */

const SCHEMA_VERSION = 1;

function LocalBackend() {
  const PREF = 'reparto:v1:';
  const subs = new Map();          // path -> Set<fn>
  const colSubs = new Map();       // colección -> Set<fn>

  // Si el navegador bloquea localStorage (modo privado, fichero data:, cookies
  // desactivadas) seguimos funcionando en memoria durante la sesión.
  let store;
  try { localStorage.setItem(PREF + '__t', '1'); localStorage.removeItem(PREF + '__t'); store = localStorage; }
  catch (e) {
    const mem = new Map();
    store = {
      getItem: k => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, v),
      removeItem: k => mem.delete(k),
      key: i => Array.from(mem.keys())[i],
      get length() { return mem.size; },
      volatil: true,
    };
  }

  const read = p => { try { const r = store.getItem(PREF + p); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
  const paths = () => { const out = []; try { for (let i = 0; i < store.length; i++) { const k = store.key(i); if (k && k.startsWith(PREF)) out.push(k.slice(PREF.length)); } } catch (e) {} return out; };
  const col = c => paths().filter(p => p.startsWith(c + '/') && p.split('/').length === 2).sort();

  function emit(p) {
    const s = subs.get(p); if (s) s.forEach(fn => { try { fn(read(p)); } catch (e) { console.error(e); } });
    const c = p.split('/')[0];
    const cs = colSubs.get(c);
    if (cs) cs.forEach(fn => { try { fn(col(c).map(k => ({ id: k.split('/')[1], data: read(k) }))); } catch (e) { console.error(e); } });
  }
  try {
    window.addEventListener('storage', ev => {
      if (ev.key && ev.key.startsWith(PREF)) emit(ev.key.slice(PREF.length));
    });
  } catch (e) {}

  return {
    kind: 'local',
    volatil: !!store.volatil,
    async get(p) { return read(p); },
    async set(p, data) { store.setItem(PREF + p, JSON.stringify(data)); emit(p); },
    async del(p) { try { store.removeItem(PREF + p); } catch (e) {} emit(p); },
    onDoc(p, fn) {
      if (!subs.has(p)) subs.set(p, new Set());
      subs.get(p).add(fn);
      Promise.resolve().then(() => fn(read(p)));
      return () => subs.get(p).delete(fn);
    },
    onCol(c, fn) {
      if (!colSubs.has(c)) colSubs.set(c, new Set());
      colSubs.get(c).add(fn);
      Promise.resolve().then(() => fn(col(c).map(k => ({ id: k.split('/')[1], data: read(k) }))));
      return () => colSubs.get(c).delete(fn);
    },
    async all() { const out = {}; paths().forEach(p => { out[p] = read(p); }); return out; },
  };
}

function DbBackend(db) {
  return {
    kind: 'db',
    async get(p) { const s = await db.doc(p).get(); return s.exists ? s.data() : null; },
    async set(p, data) { await db.doc(p).set(data); },
    async del(p) { await db.doc(p).delete(); },
    onDoc(p, fn, err) { return db.doc(p).onSnapshot(s => fn(s.exists ? s.data() : null), err); },
    onCol(c, fn, err) { return db.collection(c).onSnapshot(q => fn(q.docs.map(d => ({ id: d.id, data: d.data() }))), err); },
    async all() {
      const out = {};
      for (const p of ['app/config', 'app/huchas']) out[p] = await this.get(p);
      const q = await db.collection('meses').get();
      q.docs.forEach(d => { out['meses/' + d.id] = d.data(); });
      return out;
    },
  };
}

/** Cola de escritura con agrupación: nunca perdemos la última versión de un documento. */
function Writer(backend, onStateChange) {
  const pend = new Map();   // path -> data
  let timer = null, flying = 0;

  function bump() { onStateChange(flying > 0 || pend.size > 0 ? 'saving' : 'idle'); }

  async function flush() {
    timer = null;
    const batch = Array.from(pend.entries());
    pend.clear();
    for (const [p, data] of batch) {
      flying++; bump();
      try {
        if (data === null) await backend.del(p); else await backend.set(p, data);
      } catch (e) {
        console.error('Error al guardar', p, e);
        onStateChange('error', e);
      } finally { flying--; bump(); }
    }
    bump();
  }

  return {
    put(path, data) {
      pend.set(path, data);
      bump();
      if (timer) clearTimeout(timer);
      timer = setTimeout(flush, 320);
    },
    async flushNow() { if (timer) { clearTimeout(timer); } await flush(); },
    get pending() { return pend.size > 0 || flying > 0; },
  };
}

/** Donut. segs = [{valor, color, nombre}] (valores en céntimos, se ignoran los ≤0) */
function donut(segs, centroValor, centroLabel) {
  const R = 52, C = 2 * Math.PI * R;
  const vivos = segs.filter(s => s.valor > 0);
  const total = sum(vivos.map(s => s.valor));
  let off = 0;
  const arcos = total > 0 ? vivos.map(s => {
    const len = (s.valor / total) * C;
    const gap = vivos.length > 1 ? Math.min(2.5, len * 0.5) : 0;
    const dash = `${Math.max(0.6, len - gap)} ${C - Math.max(0.6, len - gap)}`;
    const a = `<circle class="donut__seg" cx="60" cy="60" r="${R}" fill="none"
        stroke="${s.color}" stroke-width="16" stroke-linecap="butt"
        stroke-dasharray="${dash}" stroke-dashoffset="${-off}"><title>${esc(s.nombre)}: ${eur(s.valor)}</title></circle>`;
    off += len;
    return a;
  }).join('') : `<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="16"/>`;

  return `<div class="donutbox">
    <svg viewBox="0 0 120 120" role="img" aria-label="Distribución por partida">${arcos}</svg>
    <div class="donutbox__c">
      <div class="donutbox__v">${esc(centroValor)}</div>
      <div class="label">${esc(centroLabel || '')}</div>
    </div>
  </div>`;
}

/** Leyenda de partidas. items = [{nombre, color, valor, pctTexto}] */
function leyenda(items, total) {
  return `<ul class="legend">` + items.map(i => `<li class="legend__i">
      <span class="dot" style="background:${i.color}"></span>
      <span class="legend__n">${esc(i.nombre)}</span>
      <span class="legend__v">${eur(i.valor)}</span>
      <span class="legend__p">${total > 0 ? nfPc.format(i.valor / total * 100) + '%' : '—'}</span>
    </li>`).join('') + `</ul>`;
}

/** Barra segmentada tipo app bancaria. */
function segbar(segs, extraClass) {
  const total = sum(segs.map(s => Math.max(0, s.valor)));
  if (!(total > 0)) return `<div class="segbar ${extraClass || ''}"></div>`;
  return `<div class="segbar ${extraClass || ''}" role="img" aria-label="${esc(segs.map(s => s.nombre + ' ' + eur(s.valor)).join(', '))}">` +
    segs.filter(s => s.valor > 0).map(s =>
      `<span class="segbar__s" style="flex:${s.valor} 1 0;background:${s.color}" title="${esc(s.nombre)}: ${eur(s.valor)}"></span>`
    ).join('') + `</div>`;
}

/**
 * Gráfico de líneas. series = [{nombre, color, valores:[cent|null]}], labels = [texto]
 * Deja hueco en el viewBox para las etiquetas de los ejes.
 */
function lineChart(labels, series, opts) {
  const o = opts || {};
  const W = 660, H = o.alto || 230;
  const ml = 54, mr = 14, mt = 14, mb = 26;
  const iw = W - ml - mr, ih = H - mt - mb;
  const n = labels.length;

  const todos = series.flatMap(s => s.valores.filter(v => v != null));
  if (!n || !todos.length) {
    return `<div class="empty"><span class="empty__e">📈</span><span class="empty__t">Sin datos todavía</span>
      <span class="empty__d">Confirma una nómina para empezar a ver la evolución mes a mes.</span></div>`;
  }
  let max = Math.max(...todos, 0), min = Math.min(...todos, 0);
  if (max === min) max = min + 100;
  // escala redondeada a un múltiplo agradable
  const paso = niceStep((max - min) / 4);
  const top = Math.ceil(max / paso) * paso;
  const bot = Math.floor(min / paso) * paso;
  const span = top - bot || 1;

  const X = i => ml + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => mt + ih - ((v - bot) / span) * ih;

  const ticks = [];
  for (let v = bot; v <= top + 1; v += paso) ticks.push(v);

  const grid = ticks.map(v => `<line class="lc-grid" x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W - mr}" y2="${Y(v).toFixed(1)}"/>
     <text x="${ml - 8}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${eur(v, { entero: true })}</text>`).join('');

  const paso_lbl = Math.ceil(n / (o.maxLabels || 8));
  const xlabels = labels.map((l, i) => (i % paso_lbl === 0 || i === n - 1)
    ? `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(l)}</text>` : '').join('');

  const cuerpo = series.map((s, si) => {
    const pts = s.valores.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    if (!pts.length) return '';
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = o.area === false ? '' :
      `<path class="lc-area" d="${d} L${pts[pts.length - 1][0].toFixed(1)},${Y(Math.max(bot, 0)).toFixed(1)} L${pts[0][0].toFixed(1)},${Y(Math.max(bot, 0)).toFixed(1)} Z" fill="${s.color}"/>`;
    const last = pts[pts.length - 1];
    return `${area}<path class="lc-line" d="${d}" stroke="${s.color}"/>
      ${pts.length < 26 ? pts.map(p => `<circle class="lc-pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${p === last ? 4.5 : 3}" fill="${s.color}"/>`).join('') : ''}`;
  }).join('');

  const zero = (bot < 0 && top > 0) ? `<line x1="${ml}" y1="${Y(0).toFixed(1)}" x2="${W - mr}" y2="${Y(0).toFixed(1)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>` : '';

  const key = series.length > 1 ? `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:2px">` +
    series.map(s => `<span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)">
      <span class="dot" style="background:${s.color}"></span>${esc(s.nombre)}</span>`).join('') + `</div>` : '';

  return `${key}<div class="chartwrap"><svg class="linechart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Evolución: ${esc(series.map(s => s.nombre).join(', '))}">${grid}${zero}${cuerpo}${xlabels}</svg></div>`;
}

function niceStep(x) {
  if (!(x > 0)) return 100;
  const exp = Math.pow(10, Math.floor(Math.log10(x)));
  const f = x / exp;
  const m = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return m * exp;
}

/** Barra de progreso hacia un objetivo. */
function progreso(actual, objetivo, color) {
  const p = objetivo > 0 ? clamp(actual / objetivo, 0, 1) : 0;
  return `<div class="prog"><div class="prog__f" style="width:${(p * 100).toFixed(1)}%;background:${color || 'var(--accent)'}"></div></div>`;
}

    estado: 'borrador',
    sueldo: 0,
    aporteCasa: d.aporteCasa || 0,
    cuentaConjunta: d.cuentaConjunta || 0,
    asignacion: null,
    movimientos: {},
    intereses: {},
    criba: null,
    creadoEn: new Date().toISOString(),
    confirmadoEn: null,
    cerradoEn: null,
  };
}

/* ---------- acceso ------------------------------------------------------ */

const mesesOrdenados = () => Object.keys(S.meses).sort();
const mesDoc = k => S.meses[k] || null;
function mesActivo() { return S.meses[S.mesSel] || mesDefault(S.mesSel); }
function huchas() {
  const it = (S.huchasDoc && S.huchasDoc.items) || {};
  return Object.values(it).sort((a, b) => (a.orden || 99) - (b.orden || 99) || a.nombre.localeCompare(b.nombre));
}
const hucha = id => (S.huchasDoc && S.huchasDoc.items && S.huchasDoc.items[id]) || null;
const huchaDePartida = pid => huchas().find(h => h.partida === pid) || null;
const cuentaDe = pid => (huchaDePartida(pid) || {}).cuenta || P(pid).cuenta;

/* ---------- reparto de la nómina ---------------------------------------- */

/** Calcula el reparto de un mes desde sus importes y la configuración vigente. */
function calcularReparto(doc, cfg) {
  const c = cfg || S.cfg || cfgDefault();
  const sueldo = doc.sueldo || 0;
  const casa = doc.aporteCasa || 0;
  const conjunta = doc.cuentaConjunta || 0;
  const restante = sueldo - casa - conjunta;

  const [fijos, ocio, ahorro] = repartir(restante, [c.reparto.fijos, c.reparto.ocio, c.reparto.ahorro]);
  const [ocioLibre, coche, caprichos] = repartir(ocio, [c.repartoOcio.ocioLibre, c.repartoOcio.coche, c.repartoOcio.caprichos]);

  return { sueldo, restante, casa, conjunta, fijos, ocio, ocioLibre, coche, caprichos, ahorro };
}

/**
 * Porcentajes vigentes para un mes: los congelados al confirmarlo si existen, si no
 * los actuales. Cambiar los porcentajes en Ajustes no reescribe meses ya confirmados.
 */
function cfgDeMes(doc) {
  const base = S.cfg || cfgDefault();
  if (doc && doc.snapshot && doc.snapshot.reparto && doc.snapshot.repartoOcio) {
    return Object.assign({}, base, { reparto: doc.snapshot.reparto, repartoOcio: doc.snapshot.repartoOcio });
  }
  return base;
}

/** El reparto que manda: el congelado si la nómina está confirmada, si no el vivo. */
function repartoDe(doc) {
  if (doc && doc.estado !== 'borrador' && doc.asignacion) {
    const a = doc.asignacion;
    return Object.assign({}, a, {
      ocio: (a.ocioLibre || 0) + (a.coche || 0) + (a.caprichos || 0),
      sueldo: doc.sueldo || 0,
      restante: (doc.sueldo || 0) - (a.casa || 0) - (a.conjunta || 0),
    });
  }
  return calcularReparto(doc || mesDefault(S.mesSel), cfgDeMes(doc));
}

/** Reparto a cuentas bancarias. */
function porCuenta(rep) {
  const out = {};
  Object.keys(CUENTAS).forEach(c => { out[c] = { entra: 0, partidas: [] }; });
  ORDEN_PARTIDAS.forEach(pid => {
    const cta = cuentaDe(pid);
    if (!out[cta]) out[cta] = { entra: 0, partidas: [] };
    out[cta].entra += rep[pid] || 0;
    out[cta].partidas.push({ pid, valor: rep[pid] || 0 });
  });
  return out;
}

/* ---------- movimientos y presupuestos ---------------------------------- */

function movsDe(key) {
  const d = S.meses[key];
  if (!d || !d.movimientos) return [];
  return Object.values(d.movimientos).filter(Boolean).sort((a, b) =>
    (b.fecha || '').localeCompare(a.fecha || '') || (b.creado || '').localeCompare(a.creado || ''));
}
function gastadoPorPartida(key) {
  const out = {};
  ORDEN_PARTIDAS.forEach(p => { out[p] = 0; });
  movsDe(key).forEach(m => { out[m.partida] = (out[m.partida] || 0) + (m.importe || 0); });
  return out;
}

/** Estado de los presupuestos consumibles del mes (fijos y ocio libre). */
function presupuestos(key) {
  const doc = S.meses[key] || mesDefault(key);
  const rep = repartoDe(doc);
  const g = gastadoPorPartida(key);
  return ['fijos', 'ocioLibre'].map(pid => ({
    pid, ...P(pid),
    asignado: rep[pid] || 0,
    gastado: g[pid] || 0,
    disponible: (rep[pid] || 0) - (g[pid] || 0),
  }));
}

/* ---------- saldos de huchas (derivados, nunca mutados) ------------------ */

/**
 * Recorre TODOS los meses en orden y reconstruye el saldo de cada hucha.
 * Así deshacer un cierre o borrar un gasto nunca deja el saldo descuadrado.
 * @param {string} [hasta] clave de mes inclusive; sin ella, todo el historial
 */
function saldosHuchas(hasta) {
  const out = {};
  huchas().forEach(h => {
    const ajustes = sum(Object.values(h.ajustes || {}).map(a => a.importe || 0));
    out[h.id] = {
      id: h.id, inicial: h.saldoInicial || 0, aportes: 0, criba: 0,
      intereses: 0, retenciones: 0, gastos: 0, ajustes, saldo: 0,
    };
  });
  const porPartida = {};
  huchas().forEach(h => { if (h.partida) porPartida[h.partida] = h.id; });

  for (const k of mesesOrdenados()) {
    if (hasta && k > hasta) break;
    const d = S.meses[k];
    if (!d) continue;

    if (d.estado !== 'borrador' && d.asignacion) {
      Object.keys(porPartida).forEach(pid => {
        const o = out[porPartida[pid]];
        if (o) o.aportes += d.asignacion[pid] || 0;
      });
    }
    Object.values(d.movimientos || {}).forEach(m => {
      if (!m) return;
      const hid = m.huchaId || porPartida[m.partida];
      if (hid && out[hid]) out[hid].gastos += m.importe || 0;
    });
    if (d.criba && d.criba.aplicada && d.criba.reparto) {
      Object.keys(d.criba.reparto).forEach(hid => { if (out[hid]) out[hid].criba += d.criba.reparto[hid] || 0; });
    }
    Object.keys(d.intereses || {}).forEach(hid => {
      const i = d.intereses[hid]; if (!out[hid] || !i) return;
      out[hid].intereses += i.neto || 0;
      out[hid].retenciones += i.retencion || 0;
    });
  }
  Object.values(out).forEach(o => {
    o.saldo = o.inicial + o.aportes + o.criba + o.intereses + o.ajustes - o.gastos;
  });
  return out;
}

const saldoHucha = (id, hasta) => (saldosHuchas(hasta)[id] || { saldo: 0 }).saldo;
const patrimonioHuchas = () => sum(Object.values(saldosHuchas()).map(o => o.saldo));

/* ---------- rendimiento -------------------------------------------------- */

/** Tasa mensual efectiva de una hucha (fracción, no porcentaje). */
function tasaMensual(r) {
  if (!r) return 0;
  if (r.tipo === 'compuesto') {
    const t = (r.tasa || 0) / 100;
    return r.modo === 'tin' ? t / 12 : Math.pow(1 + t, 1 / 12) - 1;
  }
  if (r.tipo === 'rentaFija' && r.modo === 'pct') return (r.tasa || 0) / 100;
  return 0;
}
/** Rendimiento anual equivalente en % para mostrar. */
function taeEquivalente(r) {
  if (!r || r.tipo === 'ninguno') return 0;
  if (r.tipo === 'rentaFija' && r.modo === 'importe') return null;
  return (Math.pow(1 + tasaMensual(r), 12) - 1) * 100;
}

/**
 * Base remunerable del mes: saldo al cierre del mes anterior más la mitad de lo que
 * ha entrado y salido durante el mes. Es la aproximación al saldo medio diario que
 * usan las cuentas remuneradas; nunca se remunera un saldo negativo.
 */
function baseInteres(h, key) {
  const inicio = saldoHucha(h.id, mesSuma(key, -1));
  const d = S.meses[key];
  let netos = 0;
  if (d) {
    if (d.estado !== 'borrador' && d.asignacion && h.partida) netos += d.asignacion[h.partida] || 0;
    Object.values(d.movimientos || {}).forEach(m => {
      if (!m) return;
      const hid = m.huchaId || (h.partida && m.partida === h.partida ? h.id : null);
      if (hid === h.id) netos -= m.importe || 0;
    });
  }
  return Math.max(0, inicio + Math.trunc(netos / 2));
}

/** Intereses de un mes para una hucha, sobre una base dada (céntimos). */
function calcularInteres(h, base) {
  const r = h.rendimiento || {};
  if (!r.tipo || r.tipo === 'ninguno') return null;
  let bruto;
  if (r.tipo === 'rentaFija' && r.modo === 'importe') bruto = redondeaCent(r.importe || 0);
  else bruto = redondeaCent(Math.max(0, base) * tasaMensual(r));
  if (!bruto) return null;
  const pctRet = r.retencion ? ((S.cfg && S.cfg.retencionPct) || 19) : 0;
  const retencion = redondeaCent(bruto * pctRet / 100);
  return { bruto, retencion, neto: bruto - retencion, base: Math.max(0, base), tasaMensual: tasaMensual(r), pctRetencion: pctRet };
}

/** Proyección mes a mes: [{mes, saldo, aportado, interesAcum}] */
function proyectar(h, meses, aporteMensual) {
  const r = h.rendimiento || {};
  const i = tasaMensual(r);
  const fijo = (r.tipo === 'rentaFija' && r.modo === 'importe') ? (r.importe || 0) : 0;
  const ret = r.retencion ? ((S.cfg && S.cfg.retencionPct) || 19) / 100 : 0;
  let saldo = saldoHucha(h.id), aportado = 0, interes = 0;
  const out = [{ k: 0, saldo, aportado, interes }];
  for (let k = 1; k <= meses; k++) {
    const bruto = fijo ? fijo : redondeaCent(Math.max(0, saldo) * i);
    const neto = bruto - redondeaCent(bruto * ret);
    saldo += neto + (aporteMensual || 0);
    interes += neto; aportado += (aporteMensual || 0);
    out.push({ k, saldo, aportado, interes });
  }
  return out;
}

/** Aportación mensual recurrente estimada para una hucha (media de meses confirmados). */
function aporteMedio(h) {
  if (!h.partida) return 0;
  const ks = mesesOrdenados().filter(k => S.meses[k] && S.meses[k].estado !== 'borrador' && S.meses[k].asignacion);
  if (!ks.length) return 0;
  const ult = ks.slice(-3);
  return Math.round(sum(ult.map(k => S.meses[k].asignacion[h.partida] || 0)) / ult.length);
}

/* ---------- criba -------------------------------------------------------- */

/** Calcula la previsualización de la criba del mes indicado. */
function calcularCriba(key, repartoManual) {
  const doc = S.meses[key] || mesDefault(key);
  const rep = repartoDe(doc);
  const g = gastadoPorPartida(key);
  const sobranteFijos = (rep.fijos || 0) - (g.fijos || 0);
  const sobranteOcio  = (rep.ocioLibre || 0) - (g.ocioLibre || 0);
  const total = sobranteFijos + sobranteOcio;

  const cfg = cfgDeMes(doc);
  const destinos = ['coche', 'caprichos']
    .map(pid => huchaDePartida(pid))
    .filter(Boolean);

  let reparto = {};
  if (repartoManual) {
    reparto = repartoManual;
  } else if (destinos.length && total > 0) {
    const pesos = destinos.map(h => cfg.cribaAuto
      ? (cfg.repartoOcio[h.partida] || 1)
      : (cfg.cribaReparto[h.partida] || 1));
    const partes = repartir(total, pesos);
    destinos.forEach((h, i) => { reparto[h.id] = partes[i]; });
  }
  return { sobranteFijos, sobranteOcio, total, reparto, destinos, aplicable: total > 0 && destinos.length > 0 };
}

  return `<span class="pill pill--pos">${ic('lock')}Cerrada</span>`;
}

function tonoDisponible(disp, asig) {
  if (disp < 0) return 'neg';
  if (asig > 0 && disp / asig < 0.2) return 'warn';
  return 'pos';
}

}

function filaMov(m) {
  const p = P(m.partida), c = CAT(m.cat);
  return `<div class="row">
    <div class="row__ic" style="background:color-mix(in srgb, ${p.color} 15%, transparent)">${esc(c.emoji)}</div>
    <div class="row__body">
      <div class="row__t">${esc(m.nota || c.nombre)}</div>
      <div class="row__s">${fechaCorta(m.fecha)} · ${esc(p.nombre)} · ${esc((CUENTAS[m.cuenta] || {}).corto || '')}</div>
    </div>
    <div class="row__v row__v--neg">−${eur(m.importe, { sinSimbolo: true })} €</div>
    <button class="iconbtn" data-act="borrarMov" data-id="${esc(m.id)}" data-mes="${esc(m.mes || S.mesSel)}" aria-label="Borrar ${esc(m.nota || c.nombre)}">${ic('trash')}</button>
  </div>`;
}

function grafEvolucion() {
  const ks = mesesOrdenados().filter(k => (S.meses[k].sueldo || 0) > 0 || Object.keys(S.meses[k].movimientos || {}).length);
  if (ks.length < 2) return '';
  const ult = ks.slice(-12);
  const gastos = ult.map(k => sum(Object.values(S.meses[k].movimientos || {}).map(m => m.importe || 0)));
  const sueldos = ult.map(k => S.meses[k].sueldo || 0);
  const ahorros = ult.map(k => { const r = repartoDe(S.meses[k]); return (r.ahorro || 0) + (r.coche || 0) + (r.caprichos || 0); });
  return `<section class="card col-12">
    <div class="card__head"><div><div class="card__title">Evolución mensual</div>
      <div class="card__sub">Últimos ${ult.length} meses</div></div></div>
    ${lineChart(ult.map(k => mesLabel(k, true)), [
      { nombre: 'Nómina', color: 'var(--c-fijos)', valores: sueldos },
      { nombre: 'A huchas', color: 'var(--c-ahorro)', valores: ahorros },
      { nombre: 'Gastado', color: 'var(--c-casa)', valores: gastos },
    ], { area: false })}
  </section>`;
}

/* ---------- NÓMINA ------------------------------------------------------- */

function previewNomina() {
  const key = S.mesSel;
  const doc = S.meses[key] || mesDefault(key);
  const rep = doc.estado !== 'borrador' && doc.asignacion ? repartoDe(doc) : calcularReparto(doc);
  const cta = porCuenta(rep);
  const cfg = cfgDeMes(doc);

  if (!rep.sueldo) {
    return `<div class="empty"><span class="empty__e">💶</span><span class="empty__t">Escribe el sueldo</span>
      <span class="empty__d">En cuanto pongas un importe verás el reparto exacto al céntimo y a qué cuenta va cada parte.</span></div>`;
  }

  const aviso = rep.restante < 0
    ? `<div class="pill pill--neg" style="align-self:flex-start;margin-bottom:12px">El aporte a casa y la conjunta se comen ${eur(-rep.restante)} más de lo que has cobrado</div>`
    : '';

  return `${aviso}
  <div style="display:flex;flex-direction:column;gap:16px">
    ${segbar(ORDEN_PARTIDAS.map(pid => ({ nombre: P(pid).nombre, valor: rep[pid] || 0, color: P(pid).color })), 'segbar--tall')}

    <div>
      <div class="kv"><span class="kv__k">Sueldo cobrado</span><span class="kv__v">${eur(rep.sueldo)}</span></div>
      <div class="kv"><span class="kv__k">🏠 Aporte a casa</span><span class="kv__v">−${eur(rep.casa, { sinSimbolo: true })} €</span></div>
      <div class="kv"><span class="kv__k">🤝 Cuenta conjunta</span><span class="kv__v">−${eur(rep.conjunta, { sinSimbolo: true })} €</span></div>
      <div class="kv kv--total"><span class="kv__k">Restante a repartir</span><span class="kv__v">${eur(rep.restante)}</span></div>
    </div>

    <div class="hr"></div>

    <div>
      ${[['fijos', cfg.reparto.fijos], ['ocio', cfg.reparto.ocio], ['ahorro', cfg.reparto.ahorro]].map(([pid, p]) => {
        if (pid === 'ocio') {
          return `<div class="kv"><span class="kv__k"><span class="dot" style="background:var(--c-ocioLibre);display:inline-block;margin-right:7px"></span>Ocio · ${nfPc.format(p)}%</span><span class="kv__v">${eur(rep.ocio)}</span></div>
          ${['ocioLibre', 'coche', 'caprichos'].map(sp => `<div class="kv" style="padding-left:22px">
            <span class="kv__k" style="font-size:12.5px"><span class="dot" style="background:${P(sp).color};display:inline-block;margin-right:7px"></span>${P(sp).emoji} ${P(sp).nombre} · ${nfPc.format(cfg.repartoOcio[sp])}% del ocio</span>
            <span class="kv__v" style="font-size:12.5px">${eur(rep[sp])}</span></div>`).join('')}`;
        }
        return `<div class="kv"><span class="kv__k"><span class="dot" style="background:${P(pid).color};display:inline-block;margin-right:7px"></span>${P(pid).emoji} ${P(pid).nombre} · ${nfPc.format(p)}%</span><span class="kv__v">${eur(rep[pid])}</span></div>`;
      }).join('')}
    </div>

    <div class="hr"></div>

    <div>
      <div class="label" style="margin-bottom:8px">Transferencias a hacer</div>
      <div class="rows">
      ${Object.keys(CUENTAS).map(cid => {
        const c = CUENTAS[cid], d = cta[cid] || { entra: 0, partidas: [] };
        return `<div class="row">
          <div class="row__ic" style="background:color-mix(in srgb, ${c.color} 16%, transparent);color:${c.color}">${ic('bank')}</div>
          <div class="row__body"><div class="row__t">${esc(c.nombre)}</div>
            <div class="row__s">${d.partidas.filter(p => p.valor).map(p => `${P(p.pid).corto} ${eur(p.valor, { entero: true })}`).join(' + ') || '—'}</div></div>
          <div class="row__v">${eur(d.entra)}</div>
        </div>`;
      }).join('')}
      </div>
    </div>
  </div>`;
}

function accionesNomina() {
  const key = S.mesSel;
  const doc = S.meses[key] || mesDefault(key);
  const rep = calcularReparto(doc);
  if (doc.estado === 'borrador') {
    return `<button class="btn btn--primary btn--lg btn--wide" data-act="confirmarNomina" ${rep.sueldo ? '' : 'disabled'}>
      ${ic('check')}Confirmar nómina y repartir</button>
      <p class="note" style="margin-top:8px">Al confirmar, ${eur(rep.coche + rep.caprichos + rep.ahorro)} entran en tus huchas y los presupuestos de fijos y ocio quedan fijados.</p>`;
  }
  if (doc.estado === 'confirmada') {
    return `<div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn--primary" data-act="abrirCierre">${ic('lock')}Cerrar el mes</button>
      <button class="btn btn--quiet" data-act="desconfirmar">${ic('undo')}Volver a borrador</button>
    </div>
    <p class="note" style="margin-top:8px">Cerrar el mes liquida los intereses de las huchas y te propone la criba de lo que ha sobrado.</p>`;
  }
  return `<button class="btn btn--ghost btn--wide" data-act="reabrir">${ic('undo')}Reabrir el mes</button>
    <p class="note" style="margin-top:8px">Cerrado el ${esc((doc.cerradoEn || '').slice(0, 10).split('-').reverse().join('/'))}. Reabrirlo deshace los intereses y la criba de este mes.</p>`;
}

  const sal = saldosHuchas();
  const movs = movsDe(key);

    ${Object.keys(CUENTAS).map(cid => {

      return `<section class="card col-4">
        <div class="card__head">
          <div class="row__ic" style="background:color-mix(in srgb, ${c.color} 16%, transparent);color:${c.color}">${ic('bank')}</div>

        </div>

          <div class="stat"><div class="label">Entra</div><div class="stat__v stat__v--sm">${eur(d.entra)}</div></div>
          <div class="stat"><div class="label">Gastado</div><div class="stat__v stat__v--sm" style="color:${gast ? 'var(--neg)' : 'inherit'}">${gast ? '−' : ''}${eur(gast, { sinSimbolo: true })} €</div></div>
          ${hs.length ? `<div class="stat"><div class="label">En huchas</div><div class="stat__v stat__v--sm">${eur(enHuchas)}</div></div>` : ''}
        </div>
        <div class="hr"></div>
        <div class="rows">
          ${d.partidas.filter(p => p.valor).map(p => `<div class="row" style="padding:7px 2px">
            <span class="dot" style="background:${P(p.pid).color}"></span>
            <div class="row__body"><div class="row__t" style="font-weight:500;font-size:13.5px">${P(p.pid).emoji} ${esc(P(p.pid).nombre)}</div></div>
            <div class="row__v">${eur(p.valor)}</div></div>`).join('') || `<p class="note">Sin asignación este mes.</p>`}
        </div>
        ${hs.length ? `<div class="hr"></div><div class="rows">${hs.map(h => `<div class="row" style="padding:7px 2px">
          <span style="font-size:15px">${esc(h.emoji)}</span>
          <div class="row__body"><div class="row__t" style="font-weight:500;font-size:13.5px">${esc(h.nombre)}</div></div>
          <div class="row__v">${eur((sal[h.id] || {}).saldo || 0)}</div></div>`).join('')}</div>` : ''}
      </section>`;
    }).join('')}

    <section class="card col-12">
      <div class="card__head">

        <div class="card__act">
          <button class="btn btn--ghost btn--sm" data-act="nuevoGasto">${ic('plus')}Añadir gasto</button>
        </div>
      </div>
      <div class="rows">
        ${movs.length ? movs.map(m => filaMov(m)).join('') : `<div class="empty"><span class="empty__e">🧾</span>
          <span class="empty__t">Ningún movimiento en ${mesLabel(key)}</span></div>`}
      </div>
    </section>
  </div>`;
}

/* ---------- HUCHAS ------------------------------------------------------- */

function vistaHuchas() {
  const sal = saldosHuchas();
  const lista = huchas();
  const total = sum(lista.map(h => (sal[h.id] || {}).saldo || 0));
  const interesTotal = sum(lista.map(h => (sal[h.id] || {}).intereses || 0));

  return `<div class="grid">
    <section class="hero col-12">
      <div class="hero__main">
        <div class="label">Ahorro acumulado</div>
        <div class="hero__amount">${eur(total)}</div>
        <div style="margin-top:14px">${segbar(lista.map(h => ({ nombre: h.nombre, valor: Math.max(0, (sal[h.id] || {}).saldo || 0), color: P(h.partida).color })), 'segbar--tall')}</div>
      </div>
      <div class="hero__side">
        <div class="stat"><div class="label">Intereses cobrados</div><div class="stat__v" style="color:var(--pos)">${eur(interesTotal)}</div><div class="stat__d">netos de retención</div></div>
        <div class="stat"><div class="label">Entra al mes</div><div class="stat__v">${eur(sum(lista.map(h => aporteMedio(h))))}</div><div class="stat__d">media de los 3 últimos</div></div>
      </div>
    </section>

    <div class="col-12 hucha__grid">
      ${lista.map(h => tarjetaHucha(h, sal[h.id] || {})).join('')}
      <button class="hucha" data-act="nuevaHucha" style="--hue:var(--ink-3);align-items:center;justify-content:center;min-height:170px;border-style:dashed;color:var(--ink-2)">
        <span style="font-size:26px">＋</span><span style="font-weight:600;font-size:14px">Nueva hucha</span>
      </button>
    </div>

    ${bloqueProyeccion()}
  </div>`;
}

function tarjetaHucha(h, o) {
  const col = P(h.partida).color;
  const r = h.rendimiento || {};
  const tae = taeEquivalente(r);
  const rend = r.tipo === 'ninguno' ? '' :
    (r.tipo === 'rentaFija' && r.modo === 'importe')
      ? `<span class="pill pill--pos">${eur(r.importe)}/mes</span>`
      : `<span class="pill pill--pos">${nfPc2.format(tae || 0)}% anual</span>`;
  const ap = aporteMedio(h);

  return `<article class="hucha" style="--hue:${col}">
    <div class="hucha__top">
      <div class="hucha__e">${esc(h.emoji)}</div>
      <div style="flex:1;min-width:0">
        <div class="hucha__n">${esc(h.nombre)}</div>
        <div class="hucha__m">${esc((CUENTAS[h.cuenta] || {}).nombre || '')}${h.partida ? ' · ' + P(h.partida).nombre : ' · manual'}</div>
      </div>
      <button class="iconbtn" data-act="editarHucha" data-id="${esc(h.id)}" aria-label="Editar ${esc(h.nombre)}">${ic('edit')}</button>
    </div>
    <div>
      <div class="hucha__s">${eur(o.saldo || 0)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        ${rend}
        ${ap ? `<span class="pill">${eur(ap, { entero: true })}/mes</span>` : ''}
        ${o.intereses ? `<span class="pill">${eur(o.intereses, { signo: true })} de intereses</span>` : ''}
      </div>
    </div>
    ${h.objetivo > 0 ? `<div>
      ${progreso(o.saldo || 0, h.objetivo, col)}
      <div class="stat__d" style="margin-top:5px">${nfPc.format(clamp((o.saldo || 0) / h.objetivo, 0, 1) * 100)}% de ${eur(h.objetivo, { entero: true })}${(o.saldo || 0) < h.objetivo && ap > 0 ? ` · faltan ${Math.ceil((h.objetivo - o.saldo) / ap)} meses` : ''}</div>
    </div>` : ''}
    <div style="display:flex;gap:6px;margin-top:auto">
      <button class="btn btn--ghost btn--sm" style="flex:1" data-act="ajustarHucha" data-id="${esc(h.id)}" data-signo="1">Ingresar</button>
      <button class="btn btn--ghost btn--sm" style="flex:1" data-act="ajustarHucha" data-id="${esc(h.id)}" data-signo="-1">Sacar</button>
    </div>
  </article>`;
}

function bloqueProyeccion() {
  const lista = huchas();
  if (!lista.length) return '';
  const hid = S.proyHucha && hucha(S.proyHucha) ? S.proyHucha : lista[0].id;
  const h = hucha(hid);
  const meses = S.proyMeses || 24;
  const ap = S.proyAporte != null ? S.proyAporte : aporteMedio(h);
  const serie = proyectar(h, meses, ap);
  const fin = serie[serie.length - 1];
  const col = P(h.partida).color;

  return `<section class="card col-12">
    <div class="card__head">
      <div><div class="card__title">Proyección</div>
      <div class="card__sub">Con el rendimiento configurado y la aportación mensual indicada</div></div>
      <div class="card__act">
        <select class="select" style="width:auto;min-height:34px;padding:5px 30px 5px 10px;font-size:13px" data-act="proyHucha">
          ${lista.map(x => `<option value="${esc(x.id)}" ${x.id === hid ? 'selected' : ''}>${esc(x.emoji)} ${esc(x.nombre)}</option>`).join('')}
        </select>
        <div class="seg">
          ${[12, 24, 60, 120].map(m => `<button class="seg__b" data-act="proyMeses" data-m="${m}" aria-pressed="${m === meses}">${m / 12} a</button>`).join('')}
        </div>
      </div>
    </div>
    <div style="display:flex;gap:22px;flex-wrap:wrap">
      <div class="stat"><div class="label">Dentro de ${meses / 12} año${meses === 12 ? '' : 's'}</div><div class="stat__v">${eur(fin.saldo)}</div></div>
      <div class="stat"><div class="label">Habrás aportado</div><div class="stat__v stat__v--sm">${eur(fin.aportado)}</div></div>
      <div class="stat"><div class="label">Intereses netos</div><div class="stat__v stat__v--sm" style="color:var(--pos)">${eur(fin.interes)}</div></div>
      <div class="field" style="min-width:160px">
        <label class="field__l" for="fProyAporte">Aportación mensual</label>
        <div class="inputgrp"><input class="input input--money" id="fProyAporte" inputmode="decimal" value="${eurRaw(ap)}"><span class="inputgrp__suf">€</span></div>
      </div>
    </div>
    ${lineChart(serie.filter((_, i) => meses <= 24 || i % Math.ceil(meses / 24) === 0 || i === serie.length - 1).map(p => p.k === 0 ? 'hoy' : (p.k % 12 === 0 ? (p.k / 12) + ' a' : '+' + p.k + 'm')),
      [{ nombre: h.nombre, color: col, valores: serie.filter((_, i) => meses <= 24 || i % Math.ceil(meses / 24) === 0 || i === serie.length - 1).map(p => p.saldo) }],
      { alto: 200 })}
