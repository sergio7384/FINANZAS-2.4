/* ============================================================================
   AVISOS Y DIÁLOGOS
   ========================================================================== */

let _toastSeq = 0;
function toast(texto, opt) {
  const o = opt || {};
  const id = 't' + (++_toastSeq);
  const el = document.createElement('div');
  el.className = 'toast' + (o.tono ? ' toast--' + o.tono : '');
  el.id = id;
  el.innerHTML = `<span class="toast__t">${esc(texto)}</span>` +
    (o.accion ? `<button class="toast__b" type="button">${esc(o.accion)}</button>` : '');
  $('#toasts').appendChild(el);
  const quitar = () => { if (el.parentNode) el.remove(); };
  const t = setTimeout(quitar, o.ms || (o.accion ? 7000 : 3600));
  if (o.accion) el.querySelector('.toast__b').addEventListener('click', () => {
    clearTimeout(t); quitar(); if (o.onAccion) o.onAccion();
  });
  return quitar;
}

let _cerrarModal = null;
// Marca que hay datos nuevos que pintar en cuanto se cierre el último diálogo
// abierto (ver renderSeguro más abajo: mientras hay un modal en pantalla no
// se repinta detrás de él, para no perder el foco de un campo que se esté
// editando dentro del propio diálogo).
let _pendiente = false;
function modal(html, opts) {
  const o = opts || {};
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim"><div class="sheet ${o.ancho ? 'sheet--wide' : ''}" role="dialog" aria-modal="true"
    aria-label="${esc(o.titulo || 'Diálogo')}">${html}</div></div>`;
  const prev = document.activeElement;
  const scrim = $('.scrim', root), sheet = $('.sheet', root);

  const cerrar = () => {
    root.innerHTML = '';
    document.removeEventListener('keydown', onKey, true);
    _cerrarModal = null;
    if (prev && prev.focus) try { prev.focus(); } catch (e) {}
    // Si algo cambió los datos mientras este diálogo (u otro apilado encima)
    // estaba abierto, renderSeguro() lo dejó pendiente en vez de descartarlo.
    // Repintamos ahora que ya no queda ningún diálogo sobre la pantalla.
    if (_pendiente && !root.children.length) { _pendiente = false; render(); }
  };
  function onKey(ev) {
    if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(); }
    if (ev.key === 'Tab') {
      const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', sheet).filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (ev.shiftKey && (i <= 0)) { ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); }
    }
  }
  scrim.addEventListener('mousedown', ev => { if (ev.target === scrim) cerrar(); });
  document.addEventListener('keydown', onKey, true);
  _cerrarModal = cerrar;
  setTimeout(() => { const a = $('[data-autofocus]', sheet) || $('button,input', sheet); if (a) a.focus(); }, 30);
  return { cerrar, sheet };
}

function confirmar(titulo, texto, etiqueta, tono) {
  return new Promise(res => {
    const m = modal(`
      <div class="sheet__head"><div><div class="sheet__t">${esc(titulo)}</div>
      <div class="sheet__s">${esc(texto)}</div></div></div>
      <div class="sheet__foot">
        <button class="btn btn--ghost" data-no>Cancelar</button>
        <button class="btn ${tono === 'danger' ? 'btn--danger' : 'btn--primary'}" data-si data-autofocus>${esc(etiqueta || 'Confirmar')}</button>
      </div>`, { titulo });
    $('[data-no]', m.sheet).onclick = () => { m.cerrar(); res(false); };
    $('[data-si]', m.sheet).onclick = () => { m.cerrar(); res(true); };
  });
}

/* ============================================================================
   PERSISTENCIA DE ALTO NIVEL
   ========================================================================== */

function guardarCfg() { S.writer.put('app/config', S.cfg); renderSeguro(); }
function guardarHuchas() { S.writer.put('app/huchas', S.huchasDoc); renderSeguro(); }
function guardarMes(key, doc) {
  doc.mes = key; doc.schemaVersion = SCHEMA_VERSION;
  S.meses[key] = doc;
  S.writer.put('meses/' + key, doc);
  renderSeguro();
}
/** Copia editable del mes indicado (creándolo si no existía). */
function editarMes(key) {
  const base = S.meses[key] || mesDefault(key);
  return JSON.parse(JSON.stringify(base));
}

/* ============================================================================
   ACCIONES SOBRE LA NÓMINA
   ========================================================================== */

function invariante(rep) {
  const s = rep.casa + rep.conjunta + rep.fijos + rep.ocioLibre + rep.coche + rep.caprichos + rep.ahorro;
  if (s !== rep.sueldo) console.error('Descuadre en el reparto:', s, '≠', rep.sueldo, rep);
  return s === rep.sueldo;
}

function confirmarNomina() {
  const key = S.mesSel, doc = editarMes(key);
  const rep = calcularReparto(doc, S.cfg);
  if (!rep.sueldo) { toast('Escribe primero el sueldo del mes.', { tono: 'neg' }); return; }
  if (rep.restante < 0) {
    toast(`El aporte a casa y la cuenta conjunta se pasan ${eur(-rep.restante)} del sueldo. Corrige alguno de los tres importes.`, { tono: 'neg', ms: 7000 });
    return;
  }
  invariante(rep);
  doc.snapshot = { reparto: Object.assign({}, S.cfg.reparto), repartoOcio: Object.assign({}, S.cfg.repartoOcio) };
  doc.asignacion = {
    casa: rep.casa, conjunta: rep.conjunta, fijos: rep.fijos,
    ocioLibre: rep.ocioLibre, coche: rep.coche, caprichos: rep.caprichos, ahorro: rep.ahorro,
  };
  doc.estado = 'confirmada';
  doc.confirmadoEn = new Date().toISOString();
  guardarMes(key, doc);
  toast(`${eur(rep.coche + rep.caprichos + rep.ahorro)} han entrado en tus huchas.`, { tono: 'pos' });
}

async function desconfirmarNomina() {
  if (!await confirmar('Volver a borrador',
    'Los aportes de esta nómina, y la criba si la habías aplicado, salen de las huchas hasta que la vuelvas a confirmar. Los gastos que hayas anotado se quedan.',
    'Volver a borrador')) return;
  const doc = editarMes(S.mesSel);
  // La criba pudo aplicarse mientras el mes estaba "confirmada" (desde el aviso
  // o el botón flotante): si no se deshace aquí, ese dinero se queda contando
  // en las huchas aunque la nómina que lo generó ya no exista.
  doc.estado = 'borrador'; doc.asignacion = null; doc.snapshot = null; doc.confirmadoEn = null; doc.criba = null;
  guardarMes(S.mesSel, doc);
}

async function reabrirMes() {
  if (!await confirmar('Reabrir el mes',
    'Se deshacen los intereses liquidados y la criba de este mes. Podrás volver a cerrarlo cuando quieras.',
    'Reabrir')) return;
  const doc = editarMes(S.mesSel);
  doc.estado = 'confirmada'; doc.intereses = {}; doc.criba = null; doc.cerradoEn = null;
  guardarMes(S.mesSel, doc);
  toast('Mes reabierto.');
}

/* ============================================================================
   GASTO RÁPIDO
   ========================================================================== */

function abrirGasto(preset) {
  const p = preset || {};
  let digitos = p.importe ? String(p.importe) : '';
  let catId = p.cat || (S.cfg && S.cfg.ultimaCat) || 'gasolina';
  let fecha = p.fecha || hoyISO();
  let partidaManual = null;
  let mas = false;

  const m = modal(`<div id="gastoBody"></div>`, { titulo: 'Nuevo gasto' });

  function cents() { return digitos ? parseInt(digitos, 10) : 0; }
  function partida() { return partidaManual || CAT(catId).partida; }

  function pintar() {
    const c = CAT(catId), pid = partida(), pr = P(pid);
    const cta = CUENTAS[cuentaDe(pid)] || {};
    const pres = presupuestos(S.mesSel).find(x => x.pid === pid);
    const sal = saldosHuchas();
    const hh = huchaDePartida(pid);
    const restaria = pres ? pres.disponible - cents() : (hh ? (sal[hh.id] || {}).saldo - cents() : null);

    $('#gastoBody').innerHTML = `
      <div class="sheet__head">
        <div><div class="sheet__t">Nuevo gasto</div>
          <div class="sheet__s">Se resta de <strong>${esc(pr.nombre)}</strong> · ${esc(cta.nombre || '')}${restaria != null ? ` · quedarían ${eur(restaria)}` : ''}</div></div>
        <button class="iconbtn" data-x aria-label="Cerrar">${ic('x')}</button>
      </div>

      <div class="padout" data-zero="${cents() === 0}">${eur(cents(), { sinSimbolo: true })} €</div>

      <div class="quickcats">
        ${CATEGORIAS.map(x => `<button class="qcat" type="button" data-cat="${esc(x.id)}" aria-pressed="${x.id === catId}">
          <span class="qcat__e">${x.emoji}</span><span>${esc(x.nombre)}</span></button>`).join('')}
      </div>

      <div class="pad">
        ${['1','2','3','4','5','6','7','8','9'].map(k => `<button class="pad__k" type="button" data-k="${k}">${k}</button>`).join('')}
        <button class="pad__k" type="button" data-k="00">00</button>
        <button class="pad__k" type="button" data-k="0">0</button>
        <button class="pad__k" type="button" data-k="del" aria-label="Borrar">⌫</button>
      </div>

      <button class="btn btn--quiet btn--sm" type="button" data-mas style="align-self:flex-start">${mas ? '− Menos opciones' : '+ Fecha, nota y partida'}</button>
      ${mas ? `
      <div style="display:grid;gap:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label class="field__l" for="gFecha">Fecha</label>
            <input class="input" type="date" id="gFecha" value="${esc(fecha)}"></div>
          <div class="field"><label class="field__l" for="gPart">Se resta de</label>
            <select class="select" id="gPart">
              ${ORDEN_PARTIDAS.filter(x => x !== 'casa' && x !== 'conjunta').map(x =>
                `<option value="${x}" ${x === pid ? 'selected' : ''}>${P(x).emoji} ${esc(P(x).nombre)}</option>`).join('')}
            </select></div>
        </div>
        <div class="field"><label class="field__l" for="gNota">Nota</label>
          <input class="input" id="gNota" placeholder="${esc(c.nombre)}" maxlength="60" value="${esc(p.nota || '')}"></div>
      </div>` : ''}

      <div class="sheet__foot">
        <button class="btn btn--ghost" type="button" data-x>Cancelar</button>
        <button class="btn btn--primary" type="button" data-ok ${cents() ? '' : 'disabled'}>Guardar gasto</button>
      </div>`;

    $$('[data-k]', m.sheet).forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'del') digitos = digitos.slice(0, -1);
      else if (digitos.length < 9) digitos = (digitos + k).replace(/^0+(?=\d)/, '');
      pintar();
    });
    $$('[data-cat]', m.sheet).forEach(b => b.onclick = () => { catId = b.dataset.cat; partidaManual = null; pintar(); });
    $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
    $('[data-mas]', m.sheet).onclick = () => { mas = !mas; pintar(); };
    const fp = $('#gPart', m.sheet); if (fp) fp.onchange = () => { partidaManual = fp.value; pintar(); };
    const ff = $('#gFecha', m.sheet); if (ff) ff.onchange = () => { fecha = ff.value || hoyISO(); };
    $('[data-ok]', m.sheet).onclick = guardar;
  }

  function guardar() {
    const imp = cents();
    if (!imp) return;
    const pid = partida();
    const nota = ($('#gNota', m.sheet) || {}).value || '';
    const key = fecha.slice(0, 7);
    const doc = editarMes(key);
    const mov = {
      id: uid('m'), mes: key, fecha, importe: imp, partida: pid,
      cuenta: cuentaDe(pid), cat: catId, nota: nota.trim(), creado: new Date().toISOString(),
    };
    doc.movimientos = doc.movimientos || {};
    doc.movimientos[mov.id] = mov;
    S.cfg.ultimaCat = catId;
    S.writer.put('app/config', S.cfg);
    // Cambiar de mes ANTES de guardar y cerrar: guardarMes()/m.cerrar() pueden
    // disparar un repintado en cuanto no quede ningún diálogo en pantalla, y
    // ese repintado debe usar ya el mes del gasto, no el que estaba antes.
    if (key !== S.mesSel) S.mesSel = key;
    guardarMes(key, doc);
    m.cerrar();
    toast(`−${eur(imp)} de ${P(pid).nombre}`, {
      tono: 'neg', accion: 'Deshacer',
      onAccion: () => borrarMov(mov.id, key, true),
    });
  }

  pintar();
}

function borrarMov(id, key, silencioso) {
  const doc = editarMes(key);
  const mov = (doc.movimientos || {})[id];
  if (!mov) return;
  delete doc.movimientos[id];
  guardarMes(key, doc);
  if (!silencioso) toast(`Gasto de ${eur(mov.importe)} borrado`, {
    accion: 'Deshacer',
    onAccion: () => { const d2 = editarMes(key); d2.movimientos[mov.id] = mov; guardarMes(key, d2); },
  });
}

/* ============================================================================
   CRIBA
   ========================================================================== */

function abrirCriba() {
  const key = S.mesSel;
  const prev = calcularCriba(key);
  if (!prev.destinos.length) { toast('No hay huchas de coche ni de caprichos donde repartir.', { tono: 'neg' }); return; }
  let reparto = Object.assign({}, prev.reparto);

  const m = modal(`<div id="cribaBody"></div>`, { titulo: 'Criba de fin de mes', ancho: true });

  function pintar() {
    const asignado = sum(Object.values(reparto));
    const desvio = prev.total - asignado;
    $('#cribaBody').innerHTML = `
      <div class="sheet__head">
        <div><div class="sheet__t">Criba de ${mesLabel(key)}</div>
          <div class="sheet__s">Lo que ha sobrado de gastos fijos y de ocio libre pasa a tus huchas</div></div>
        <button class="iconbtn" data-x aria-label="Cerrar">${ic('x')}</button>
      </div>

      <div>
        <div class="kv"><span class="kv__k">🧾 Sobra de gastos fijos</span>
          <span class="kv__v" style="color:${prev.sobranteFijos < 0 ? 'var(--neg)' : 'inherit'}">${eur(prev.sobranteFijos)}</span></div>
        <div class="kv"><span class="kv__k">🍻 Sobra de ocio libre</span>
          <span class="kv__v" style="color:${prev.sobranteOcio < 0 ? 'var(--neg)' : 'inherit'}">${eur(prev.sobranteOcio)}</span></div>
        <div class="kv kv--total"><span class="kv__k">A repartir</span><span class="kv__v">${eur(prev.total)}</span></div>
      </div>

      ${prev.total <= 0 ? `<div class="empty"><span class="empty__e">🫙</span>
        <span class="empty__t">Este mes no ha sobrado nada</span>
        <span class="empty__d">${prev.total < 0 ? `Te has pasado ${eur(-prev.total)} del presupuesto de fijos y ocio. No se toca ninguna hucha.` : 'Has gastado justo lo presupuestado.'}</span></div>` : `

      <div class="hr"></div>
      <div style="display:grid;gap:12px">
        ${prev.destinos.map(h => `<div class="field">
          <label class="field__l" for="cr-${esc(h.id)}">
            <span class="dot" style="background:${P(h.partida).color};display:inline-block;margin-right:7px"></span>
            ${esc(h.emoji)} ${esc(h.nombre)} · ahora ${eur(saldoHucha(h.id))}</label>
          <div class="inputgrp">
            <input class="input input--money" id="cr-${esc(h.id)}" data-dest="${esc(h.id)}" inputmode="decimal" value="${eurRaw(reparto[h.id] || 0)}">
            <span class="inputgrp__suf">€</span></div>
        </div>`).join('')}
      </div>
      ${desvio !== 0 ? `<div class="pill pill--${desvio > 0 ? 'warn' : 'neg'}" style="align-self:flex-start">
        ${desvio > 0 ? `Quedan ${eur(desvio)} sin asignar` : `Te pasas ${eur(-desvio)} de lo que ha sobrado`}</div>` : ''}
      <p class="note">Por defecto se reparte en la misma proporción que coche y caprichos tienen dentro del ocio
        (${nfPc.format(cfgDeMes(S.meses[key]).repartoOcio.coche / (cfgDeMes(S.meses[key]).repartoOcio.coche + cfgDeMes(S.meses[key]).repartoOcio.caprichos) * 100)}% / ${nfPc.format(cfgDeMes(S.meses[key]).repartoOcio.caprichos / (cfgDeMes(S.meses[key]).repartoOcio.coche + cfgDeMes(S.meses[key]).repartoOcio.caprichos) * 100)}%). Puedes cambiar los importes a mano.</p>
      `}

      <div class="sheet__foot">
        <button class="btn btn--ghost" data-x>Cancelar</button>
        ${prev.total > 0 ? `<button class="btn btn--primary" data-ok ${desvio !== 0 ? 'disabled' : ''}>${ic('check')}Confirmar y meter en las huchas</button>` : ''}
      </div>`;

    $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
    $$('[data-dest]', m.sheet).forEach(inp => {
      inp.oninput = () => { reparto[inp.dataset.dest] = parseMoney(inp.value) || 0; pintarSoloAviso(); };
      inp.onblur = () => pintar();
    });
    const ok = $('[data-ok]', m.sheet);
    if (ok) ok.onclick = aplicar;
  }
  function pintarSoloAviso() {
    const asignado = sum(Object.values(reparto));
    const ok = $('[data-ok]', m.sheet);
    if (ok) ok.disabled = (asignado !== prev.total);
  }
  function aplicar() {
    const doc = editarMes(key);
    doc.criba = {
      aplicada: true, sobranteFijos: prev.sobranteFijos, sobranteOcio: prev.sobranteOcio,
      total: prev.total, reparto: reparto, fecha: new Date().toISOString(),
    };
    guardarMes(key, doc);
    m.cerrar();
    toast(`${eur(prev.total)} repartidos entre tus huchas.`, { tono: 'pos' });
  }
  pintar();
}

function deshacerCriba() {
  const key = S.mesSel;               // se fija aquí: el «Rehacer» del toast debe
  const doc = editarMes(key);         // escribir en ESTE mes aunque mientras tanto
  if (!doc.criba) return;             // el usuario haya navegado a otro mes.
  const prev = doc.criba;
  doc.criba = null;
  guardarMes(key, doc);
  toast('Criba deshecha.', {
    accion: 'Rehacer',
    onAccion: () => { const d = editarMes(key); d.criba = prev; guardarMes(key, d); },
  });
}

/* ============================================================================
   CIERRE DE MES
   ========================================================================== */

function abrirCierre() {
  const key = S.mesSel;
  const liq = huchas().map(h => {
    const base = baseInteres(h, key);
    const i = calcularInteres(h, base);
    return i ? { h, i } : null;
  }).filter(Boolean);
  const prev = calcularCriba(key);
  let conCriba = prev.total > 0;

  const m = modal(`
    <div class="sheet__head">
      <div><div class="sheet__t">Cerrar ${mesLabel(key)}</div>
        <div class="sheet__s">Se liquidan los intereses y, si quieres, se hace la criba</div></div>
      <button class="iconbtn" data-x aria-label="Cerrar">${ic('x')}</button>
    </div>

    <div>
      <div class="label" style="margin-bottom:8px">1 · Intereses de las huchas remuneradas</div>
      ${liq.length ? `<div class="rows">${liq.map(({ h, i }) => `<div class="row">
        <div class="row__ic" style="background:color-mix(in srgb, ${P(h.partida).color} 15%, transparent)">${esc(h.emoji)}</div>
        <div class="row__body"><div class="row__t">${esc(h.nombre)}</div>
          <div class="row__s">sobre ${eur(i.base)}${i.retencion ? ` · retención ${eur(i.retencion)}` : ''}</div></div>
        <div class="row__v row__v--pos">+${eur(i.neto, { sinSimbolo: true })} €</div></div>`).join('')}</div>
        <p class="note" style="margin-top:6px">Total neto: <strong>${eur(sum(liq.map(x => x.i.neto)))}</strong>. Se calcula sobre el saldo medio aproximado del mes; es una estimación, no la liquidación del banco.</p>`
      : `<p class="note">Ninguna hucha tiene rendimiento configurado este mes.</p>`}
    </div>

    <div class="hr"></div>

    <div>
      <div class="label" style="margin-bottom:8px">2 · Criba de lo que ha sobrado</div>
      ${prev.total > 0 ? `
        <label class="switch" style="margin-bottom:8px">
          <input type="checkbox" id="cCriba" checked><span class="switch__t"></span>
          <span style="font-size:13.5px">Repartir ${eur(prev.total)} entre coche y caprichos</span></label>
        <div class="rows">${prev.destinos.map(h => `<div class="row" style="padding:6px 2px">
          <span class="dot" style="background:${P(h.partida).color}"></span>
          <div class="row__body"><div class="row__t" style="font-size:13.5px;font-weight:500">${esc(h.emoji)} ${esc(h.nombre)}</div></div>
          <div class="row__v row__v--pos">+${eur(prev.reparto[h.id] || 0, { sinSimbolo: true })} €</div></div>`).join('')}</div>`
      : `<p class="note">${prev.total < 0 ? `Este mes te has pasado ${eur(-prev.total)} del presupuesto: no se reparte nada.` : 'No ha sobrado nada que repartir.'}</p>`}
    </div>

    <div class="sheet__foot">
      <button class="btn btn--ghost" data-x>Cancelar</button>
      <button class="btn btn--primary" data-ok data-autofocus>${ic('lock')}Cerrar el mes</button>
    </div>`, { titulo: 'Cerrar mes', ancho: true });

  $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
  const chk = $('#cCriba', m.sheet);
  if (chk) chk.onchange = () => { conCriba = chk.checked; };

  $('[data-ok]', m.sheet).onclick = () => {
    const doc = editarMes(key);
    doc.intereses = {};
    liq.forEach(({ h, i }) => { doc.intereses[h.id] = Object.assign({ fecha: hoyISO() }, i); });
    if (conCriba && prev.total > 0) {
      doc.criba = {
        aplicada: true, sobranteFijos: prev.sobranteFijos, sobranteOcio: prev.sobranteOcio,
        total: prev.total, reparto: prev.reparto, fecha: new Date().toISOString(),
      };
    }
    doc.estado = 'cerrada';
    doc.cerradoEn = new Date().toISOString();
    guardarMes(key, doc);

    const sig = mesSuma(key, 1);
    if (!S.meses[sig]) guardarMes(sig, mesDefault(sig));

    m.cerrar();
    const gan = sum(liq.map(x => x.i.neto)) + (conCriba && prev.total > 0 ? prev.total : 0);
    toast(`${mesLabel(key)} cerrado${gan ? `. ${eur(gan)} más en tus huchas.` : '.'}`, { tono: 'pos' });
    S.mesSel = sig;
    renderSeguro();
  };
}

        <div class="field"><label class="field__l" for="hNombre">Nombre</label>
          <input class="input" id="hNombre" maxlength="28" placeholder="Viaje a Japón" value="${esc(h.nombre)}" data-autofocus></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="field__l" for="hCuenta">Cuenta donde vive</label>
          <select class="select" id="hCuenta">${Object.values(CUENTAS).map(c =>
            `<option value="${c.id}" ${c.id === h.cuenta ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div>
        <div class="field"><label class="field__l" for="hPartida">Se alimenta de</label>
          <select class="select" id="hPartida">
            <option value="">Solo aportes manuales</option>
            ${['coche', 'caprichos', 'ahorro'].map(p => `<option value="${p}" ${p === h.partida ? 'selected' : ''}>${P(p).emoji} ${esc(P(p).nombre)} de la nómina</option>`).join('')}
          </select></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="field__l" for="hInicial">Saldo de partida</label>
          <div class="inputgrp"><input class="input input--money" id="hInicial" inputmode="decimal" value="${eurRaw(h.saldoInicial)}"><span class="inputgrp__suf">€</span></div>
          <span class="field__h">Lo que ya tienes ahorrado hoy</span></div>

          <div class="inputgrp"><input class="input input--money" id="hObjetivo" inputmode="decimal" value="${h.objetivo ? eurRaw(h.objetivo) : ''}" placeholder="0,00"><span class="inputgrp__suf">€</span></div></div>
      </div>

      <div class="hr"></div>

      <div class="field">
        <span class="field__l">Rendimiento</span>
        <div class="seg seg--wide">
          ${[['ninguno', 'Ninguno'], ['compuesto', 'Interés compuesto'], ['rentaFija', 'Renta fija mensual']].map(([v, n]) =>
            `<button class="seg__b" type="button" data-tipo="${v}" aria-pressed="${r.tipo === v}">${n}</button>`).join('')}

          <div class="field"><label class="field__l" for="hTasa">Tipo anunciado</label>

      <div class="sheet__foot">
        ${!nueva && h.partida !== 'coche' && h.partida !== 'caprichos' && h.partida !== 'ahorro'
          ? `<button class="btn btn--danger" data-del>${ic('trash')}Borrar</button>` : ''}
        <button class="btn btn--ghost" data-x>Cancelar</button>
        <button class="btn btn--primary" data-ok>Guardar</button>
      </div>`;

    $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
    $$('[data-tipo]', m.sheet).forEach(b => b.onclick = () => {
      leer(); r.tipo = b.dataset.tipo;
      if (r.tipo === 'compuesto' && r.modo !== 'tae' && r.modo !== 'tin') r.modo = 'tae';
      if (r.tipo === 'rentaFija' && r.modo !== 'pct' && r.modo !== 'importe') r.modo = 'pct';
      pintar();
    });
    $$('[data-modo]', m.sheet).forEach(b => b.onclick = () => { leer(); r.modo = b.dataset.modo; pintar(); });
    const del = $('[data-del]', m.sheet);
    if (del) del.onclick = async () => {
      if (!await confirmar('Borrar hucha', `Se borra «${h.nombre}» y su saldo deja de contar. Los gastos que apuntaste siguen en el historial.`, 'Borrar', 'danger')) return;
      delete S.huchasDoc.items[h.id]; guardarHuchas(); m.cerrar(); toast('Hucha borrada.');
    };
    $('[data-ok]', m.sheet).onclick = () => {
      leer();
      if (!h.nombre.trim()) { toast('Ponle un nombre a la hucha.', { tono: 'neg' }); return; }
      if (nueva) {
        const base = h.nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 20) || 'hucha';
        let cand = base, n = 2;
        while (S.huchasDoc.items[cand]) cand = base + '_' + (n++);
        h.id = cand;
      }
      S.huchasDoc.items[h.id] = h;
      guardarHuchas(); m.cerrar();
      toast(nueva ? 'Hucha creada.' : 'Hucha actualizada.', { tono: 'pos' });
    };
  }

  function leer() {
    const g = s => $(s, m.sheet);
    if (g('#hNombre')) h.nombre = g('#hNombre').value;
    if (g('#hEmoji')) h.emoji = g('#hEmoji').value.trim() || '🪙';
    if (g('#hCuenta')) h.cuenta = g('#hCuenta').value;
    if (g('#hPartida')) h.partida = g('#hPartida').value;
    if (g('#hInicial')) h.saldoInicial = parseMoney(g('#hInicial').value) || 0;
    if (g('#hObjetivo')) h.objetivo = parseMoney(g('#hObjetivo').value) || 0;
    if (g('#hTasa')) r.tasa = Math.max(0, parseMoney(g('#hTasa').value) / 100 || 0);
    if (g('#hImporte')) r.importe = parseMoney(g('#hImporte').value) || 0;
    if (g('#hRet')) r.retencion = g('#hRet').checked;
  }
  pintar();
}

function ajustarHucha(id, signo) {
  const h = hucha(id); if (!h) return;
  const entra = signo > 0;
  const m = modal(`
    <div class="sheet__head">
      <div><div class="sheet__t">${entra ? 'Ingresar en' : 'Sacar de'} ${esc(h.nombre)}</div>
        <div class="sheet__s">Saldo actual ${eur(saldoHucha(id))}</div></div>
      <button class="iconbtn" data-x aria-label="Cerrar">${ic('x')}</button>
    </div>
    <div class="field"><label class="field__l" for="aImp">Importe</label>
      <div class="inputgrp"><input class="input input--big" id="aImp" inputmode="decimal" placeholder="0,00" data-autofocus><span class="inputgrp__suf">€</span></div></div>
    <div class="field"><label class="field__l" for="aNota">Concepto</label>
      <input class="input" id="aNota" maxlength="60" placeholder="${entra ? 'Ingreso extra' : 'Retirada'}"></div>
    <div class="sheet__foot">
      <button class="btn btn--ghost" data-x>Cancelar</button>
      <button class="btn btn--primary" data-ok>${entra ? 'Ingresar' : 'Sacar'}</button>
    </div>`, { titulo: 'Ajuste de hucha' });

  $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
  $('[data-ok]', m.sheet).onclick = () => {
    const v = parseMoney($('#aImp', m.sheet).value);
    if (!v) { toast('Escribe un importe.', { tono: 'neg' }); return; }
    const aj = { id: uid('a'), fecha: hoyISO(), importe: Math.abs(v) * signo, nota: $('#aNota', m.sheet).value.trim() };
    const hh = S.huchasDoc.items[id];
    hh.ajustes = hh.ajustes || {};
    hh.ajustes[aj.id] = aj;
    guardarHuchas(); m.cerrar();
    toast(`${entra ? '+' : '−'}${eur(Math.abs(v))} en ${h.nombre}`, {
      tono: entra ? 'pos' : 'neg', accion: 'Deshacer',
      onAccion: () => { delete S.huchasDoc.items[id].ajustes[aj.id]; guardarHuchas(); },
    });
  };
}

async function descargar(nombre, contenido, mime) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: nombre, data: contenido }); return true; }
    }
  } catch (e) { /* el visor puede rechazarlo; seguimos con el respaldo */ }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenido], { type: mime || 'text/plain;charset=utf-8' }));
    a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  } catch (e) {}
  modal(`<div class="sheet__head"><div><div class="sheet__t">${esc(nombre)}</div>

function exportarCsv() {

  mesesOrdenados().forEach(k => movsDe(k).slice().reverse().forEach(m => {

function importarJson() {
  const m = modal(`
    <div class="sheet__head"><div><div class="sheet__t">Importar copia</div>
      <div class="sheet__s">Sustituye todos los datos actuales por los del fichero</div></div>

    <textarea class="input" id="impText" rows="6" style="font-family:var(--font-mono);font-size:11.5px" placeholder='{"formato":"reparto-nomina", ...}'></textarea>
    <div class="sheet__foot"><button class="btn btn--ghost" data-x>Cancelar</button>
      <button class="btn btn--primary" data-ok>Importar</button></div>`, { titulo: 'Importar', ancho: true });

  $$('[data-x]', m.sheet).forEach(b => b.onclick = m.cerrar);
  $('#impFile', m.sheet).onchange = ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { $('#impText', m.sheet).value = String(rd.result || ''); };
    rd.readAsText(f);
  };
  $('[data-ok]', m.sheet).onclick = async () => {
    let d;
    try { d = JSON.parse($('#impText', m.sheet).value); }
    catch (e) { toast('Ese texto no es un JSON válido.', { tono: 'neg' }); return; }
    if (!d || d.formato !== 'reparto-nomina') { toast('El fichero no es una copia de esta aplicación.', { tono: 'neg' }); return; }
    if (!await confirmar('Importar copia', 'Se sustituyen todos los datos actuales. No se puede deshacer.', 'Importar', 'danger')) return;
    S.cfg = migrar(d.config, cfgDefault());
    S.huchasDoc = migrar(d.huchas, huchasDefault());
    Object.keys(S.meses).forEach(k => { S.writer.put('meses/' + k, null); delete S.meses[k]; });
    Object.keys(d.meses || {}).forEach(k => { S.meses[k] = d.meses[k]; S.writer.put('meses/' + k, d.meses[k]); });
    S.writer.put('app/config', S.cfg); S.writer.put('app/huchas', S.huchasDoc);
    m.cerrar(); render(); toast('Copia importada.', { tono: 'pos' });
  };
}

function cargarEjemplo() {
  const base = mesActualKey();
  const sueldos = [198450, 214300, 187620, 226180];
  const gastosPorMes = [
    [['gasolina', 6200], ['cena', 4150], ['super', 8900], ['suscrip', 2199], ['capricho', 3499]],
    [['gasolina', 5840], ['copas', 2600], ['super', 9450], ['suscrip', 2199], ['taller', 14500], ['cena', 5320]],
    [['gasolina', 7010], ['cena', 3890], ['super', 8720], ['suscrip', 2199], ['viaje', 18900]],
    [['gasolina', 6350], ['capricho', 5990], ['super', 9100], ['suscrip', 2199]],
  ];
  S.cfg = cfgDefault();
  S.cfg.defaults = { aporteCasa: 55000, cuentaConjunta: 30000 };
  S.cfg.demo = true;
  S.huchasDoc = huchasDefault();
  S.huchasDoc.items.ahorro.saldoInicial = 412000;
  S.huchasDoc.items.ahorro.objetivo = 1500000;
  S.huchasDoc.items.coche.objetivo = 600000;
  S.huchasDoc.items.caprichos.objetivo = 0;
  S.meses = Object.create(null);

  for (let i = 0; i < 4; i++) {
    const k = mesSuma(base, i - 3);
    const doc = mesDefault(k);
    doc.sueldo = sueldos[i];
    doc.aporteCasa = 55000; doc.cuentaConjunta = 30000;
    const rep = calcularReparto(doc, S.cfg);
    doc.snapshot = { reparto: Object.assign({}, S.cfg.reparto), repartoOcio: Object.assign({}, S.cfg.repartoOcio) };
    doc.asignacion = { casa: rep.casa, conjunta: rep.conjunta, fijos: rep.fijos, ocioLibre: rep.ocioLibre, coche: rep.coche, caprichos: rep.caprichos, ahorro: rep.ahorro };
    doc.estado = 'confirmada';
    doc.confirmadoEn = new Date().toISOString();
    gastosPorMes[i].forEach((g, j) => {
      const cat = CAT(g[0]);
      const dia = String(3 + j * 5).padStart(2, '0');
      const id = `demo-${k}-${j}`;
      doc.movimientos[id] = {
        id, mes: k, fecha: `${k}-${dia}`, importe: g[1], partida: cat.partida,
        cuenta: cuentaDe(cat.partida), cat: cat.id, nota: '', creado: `${k}-${dia}T10:00:00Z`,

    if (i < 3) {

      const iAh = calcularInteres(S.huchasDoc.items.ahorro, baseInteres(S.huchasDoc.items.ahorro, k));

    S.writer.put('meses/' + k, doc);
  }
  S.writer.put('app/config', S.cfg);
  S.writer.put('app/huchas', S.huchasDoc);

/* ============================================================================
   MIGRACIÓN
   ========================================================================== */

/** Completa un documento leído con los campos que falten, sin pisar los que hay. */
function migrar(doc, plantilla) {
  if (!doc || typeof doc !== 'object') return JSON.parse(JSON.stringify(plantilla));
  const out = JSON.parse(JSON.stringify(plantilla));
  Object.keys(doc).forEach(k => {
    const v = doc[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k])) {
      out[k] = Object.assign({}, out[k], v);
      Object.keys(v).forEach(k2 => {
        if (v[k2] && typeof v[k2] === 'object' && !Array.isArray(v[k2]) && out[k][k2] && typeof out[k][k2] === 'object') {
          out[k][k2] = Object.assign({}, plantilla[k] && plantilla[k][k2] ? plantilla[k][k2] : {}, v[k2]);
        }
      });
    } else out[k] = v;
  });
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}
function migrarMes(doc, key) {
  const out = Object.assign(mesDefault(key), doc || {});
  out.movimientos = out.movimientos || {};
  out.intereses = out.intereses || {};
  out.mes = key;
  return out;
}

function temaEfectivo() {
  const t = (S.cfg && S.cfg.tema) || 'auto';
  if (t !== 'auto') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function aplicarTema() {
  const t = (S.cfg && S.cfg.tema) || 'auto';
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const oscuro = temaEfectivo() === 'dark';
  const use = $('#themeIcon'), lab = $('#themeLabel');
  if (use) use.setAttribute('href', oscuro ? '#i-sun' : '#i-moon');
  if (lab) lab.textContent = oscuro ? 'Tema claro' : 'Tema oscuro';
}
function alternarTema() {
  S.cfg.tema = temaEfectivo() === 'dark' ? 'light' : 'dark';
  aplicarTema(); guardarCfg();
}

/* ---------- enlaces de cada vista --------------------------------------- */

function enlazarVista() {
  if (S.vista === 'nomina') {
    refrescarNomina();
    const campos = [['#fSueldo', 'sueldo'], ['#fCasa', 'aporteCasa'], ['#fConj', 'cuentaConjunta']];
    campos.forEach(([sel, campo]) => {
      const el = $(sel); if (!el) return;
      el.addEventListener('input', () => {
        const doc = editarMes(S.mesSel);
        doc[campo] = parseMoney(el.value) || 0;
        if (doc.estado !== 'borrador' && doc.asignacion) {
          const rep = calcularReparto(doc, cfgDeMes(doc));
          if (rep.restante >= 0) {
            doc.asignacion = { casa: rep.casa, conjunta: rep.conjunta, fijos: rep.fijos, ocioLibre: rep.ocioLibre, coche: rep.coche, caprichos: rep.caprichos, ahorro: rep.ahorro };
          }
        }
        S.meses[S.mesSel] = doc;
        S.writer.put('meses/' + S.mesSel, doc);
        refrescarNomina(); refrescarFabs();
      });
      el.addEventListener('blur', () => {
        const c = parseMoney(el.value);
        el.value = c ? eurRaw(c) : '';
        if (_pendiente) { _pendiente = false; render(); }
      });
    });
    const rec = $('#fRecordar');
    if (rec) rec.addEventListener('change', () => {
      if (!rec.checked) return;
      const doc = S.meses[S.mesSel] || mesDefault(S.mesSel);
      S.cfg.defaults = { aporteCasa: doc.aporteCasa || 0, cuentaConjunta: doc.cuentaConjunta || 0 };
      guardarCfg();
      toast('Guardados como valores por defecto.', { tono: 'pos' });
    });
  }

  if (S.vista === 'ajustes') {
    $$('[data-pc]').forEach(el => {
      el.addEventListener('input', () => {
        const [g, k] = el.dataset.pc.split('.');
        const v = parseMoney(el.value);
        S.cfg[g][k] = v == null ? 0 : v / 100;
        S.writer.put('app/config', S.cfg);
      });
      el.addEventListener('blur', () => render());
    });
    [['#dCasa', 'aporteCasa'], ['#dConj', 'cuentaConjunta']].forEach(([sel, k]) => {
      const el = $(sel); if (!el) return;
      el.addEventListener('input', () => { S.cfg.defaults[k] = parseMoney(el.value) || 0; S.writer.put('app/config', S.cfg); });
      el.addEventListener('blur', () => { el.value = eurRaw(S.cfg.defaults[k]); });
    });
    const ret = $('#dRet');
    if (ret) {
      ret.addEventListener('input', () => { const v = parseMoney(ret.value); S.cfg.retencionPct = v == null ? 19 : clamp(v / 100, 0, 100); S.writer.put('app/config', S.cfg); });
      ret.addEventListener('blur', () => render());
    }
    const ca = $('#fCribaAuto');
    if (ca) ca.addEventListener('change', () => { S.cfg.cribaAuto = ca.checked; guardarCfg(); });
    pintarEstadoAlmacen();
  }

  if (S.vista === 'huchas') {
    const sel = $('[data-act="proyHucha"]');
    if (sel) sel.addEventListener('change', () => { S.proyHucha = sel.value; S.proyAporte = null; render(); });
    const ap = $('#fProyAporte');
    if (ap) {
      ap.addEventListener('input', () => { S.proyAporte = parseMoney(ap.value) || 0; });
      ap.addEventListener('blur', () => render());
    }
  }
}

let _avisoGuardado = false;
function estadoAlmacen(estado) {
  const el = $('#storage'), tx = $('#storageText');
  if (!el) return;
  if (estado === 'saving') { el.dataset.state = 'saving'; tx.textContent = 'Guardando…'; return; }
  if (estado === 'error' && !_avisoGuardado) {
    _avisoGuardado = true;
    toast('No se ha podido guardar. Exporta una copia desde Ajustes antes de cerrar.', { tono: 'neg', ms: 9000 });
  }
  const db = S.backend && S.backend.kind === 'db';
  const volatil = S.backend && S.backend.volatil;
  el.dataset.state = db ? 'sync' : 'local';
  tx.textContent = db ? 'Sincronizado' : (volatil ? 'Sin guardar en disco' : 'Solo en este equipo');
}

async function cargarDesde(backend) {
  S.cfg = migrar(await backend.get('app/config'), cfgDefault());
  S.huchasDoc = migrar(await backend.get('app/huchas'), huchasDefault());
  const meses = Object.create(null);
  const todo = await backend.all();
  Object.keys(todo).forEach(p => {
    if (p.startsWith('meses/') && todo[p]) { const k = p.slice(6); meses[k] = migrarMes(todo[p], k); }
  });
  S.meses = meses;
}

async function boot() {
  const local = LocalBackend();
  S.backend = local;
  S.writer = Writer(local, estadoAlmacen);
  await cargarDesde(local);
  if (!S.meses[S.mesSel]) S.meses[S.mesSel] = mesDefault(S.mesSel);
  S.listo = true;
  aplicarTema();
  render();
  estadoAlmacen();

  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { estadoAlmacen(); return; }

  const remoto = DbBackend(db);
  try {
    const cfgRemota = await remoto.get('app/config');
    const hayLocal = Object.keys(S.meses).some(k => (S.meses[k].sueldo || 0) > 0 || Object.keys(S.meses[k].movimientos || {}).length);
    if (!cfgRemota && hayLocal) {
      await remoto.set('app/config', S.cfg);
      await remoto.set('app/huchas', S.huchasDoc);
      for (const k of mesesOrdenados()) await remoto.set('meses/' + k, S.meses[k]);
    }
    S.backend = remoto;
    S.writer = Writer(remoto, estadoAlmacen);
    await cargarDesde(remoto);
    if (!S.meses[S.mesSel]) S.meses[S.mesSel] = mesDefault(S.mesSel);

    remoto.onDoc('app/config', d => { if (d) { S.cfg = migrar(d, cfgDefault()); renderSeguro(); } }, () => {});
    remoto.onDoc('app/huchas', d => { if (d) { S.huchasDoc = migrar(d, huchasDefault()); renderSeguro(); } }, () => {});
    remoto.onCol('meses', arr => {
      const m = Object.create(null);
      arr.forEach(x => { if (x.data) m[x.id] = migrarMes(x.data, x.id); });
      Object.keys(m).length && (S.meses = m);
      if (!S.meses[S.mesSel]) S.meses[S.mesSel] = mesDefault(S.mesSel);
      renderSeguro();
    }, () => {});

    render();
    estadoAlmacen();
  } catch (e) {
    console.warn('No se pudo usar el almacén sincronizado:', e);
    estadoAlmacen();
  }
}

boot();


if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      /* si el navegador lo bloquea (p. ej. en HTTP sin TLS) la app sigue
         funcionando igual, sólo sin instalación ni caché offline */
    });
  });
}

</script>
